base_url: https://{xms-controller}/v1
api_style: REST over HTTPS, JSON requests and responses

authentication:
  scheme: >-
    API token in the Xms-Auth-Token request header (tokenInHeader) or a token
    query parameter (tokenInQuery). Tokens are minted by POST /auth/tokens:login
    (Login) or POST /auth/tokens (CreateToken); long-lived access tokens are
    managed through the /access-tokens/ resource.
  detail: authentication/xsky-authentication.yml

idempotency:
  supported: false
  notes: >-
    No Idempotency-Key or equivalent replay-protection header is declared in
    the contract. GET/HEAD reads are inherently idempotent; PATCH updates and
    DELETE removals are idempotent by resource semantics only.

pagination:
  style: offset
  request_params:
    limit: page size (declared on 109 list operations)
    offset: number of records to skip (declared on 109 list operations)
  filtering:
    q: full-text query across the collection (62 operations)
    sort: sort expression (61 operations)

