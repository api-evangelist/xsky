name: XSKY
description: XSKY (XSKY Data Technology, 星辰天合) is a Beijing-based software-defined
  storage vendor serving nearly 2,000 large government and enterprise institutions,
  ranked first in China's object-storage software market. Its distributed storage
  products — XEUS unified storage, XEBS block storage, XEOS object storage, XGFS
  file storage, and the XEDP unified data platform — are all managed through XMS,
  the platform's REST controller API, which XSKY publishes as a Swagger 2.0 contract
  with official Go and Python clients plus a CloudFormation-style provisioning
  tool (sds-formation) and a Kubernetes CSI driver.
