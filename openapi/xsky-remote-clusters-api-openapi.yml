openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Remote Clusters API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: remote-clusters
  description: RemoteClusterController API /remote-clusters
paths:
  /remote-clusters/:
    get:
      tags:
      - remote-clusters
      operationId: ListRemoteClusters
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: fs_id
        in: query
        description: fsid of cluster
        required: false
        x-exportParamName: FsId
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteClustersResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List remote clusters
      x-summary-source: derived
    post:
      tags:
      - remote-clusters
      description: Create a remote cluster
      operationId: CreateRemoteCluster
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteClusterResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteClusterCreateReq'
        description: remote cluster info
        required: true
      summary: Create remote cluster
      x-summary-source: derived
  /remote-clusters/{cluster_id}:
    get:
      tags:
      - remote-clusters
      operationId: GetRemoteCluster
      parameters:
      - name: cluster_id
        in: path
        description: remote cluster id
        required: true
        x-exportParamName: ClusterId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteClusterResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get remote cluster
      x-summary-source: derived
    delete:
      tags:
      - remote-clusters
      description: Delete a remote cluster
      operationId: DeleteRemoteCluster
      parameters:
      - name: cluster_id
        in: path
        description: remote cluster id
        required: true
        x-exportParamName: ClusterId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteClusterResp'
        204:
          description: NoContent
        400:
          description: BadRequest
        403:
          description: Forbidden
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete remote cluster
      x-summary-source: derived
    patch:
      tags:
      - remote-clusters
      description: Update a remote cluster
      operationId: UpdateRemoteCluster
      parameters:
      - name: cluster_id
        in: path
        description: remote cluster id
        required: true
        x-exportParamName: ClusterId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteClusterResp'
        400:
          description: BadRequest
        403:
          description: Forbidden
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteClusterUpdateReq'
        description: remote cluster info
        required: true
      summary: Update remote cluster
      x-summary-source: derived
components:
