        url: url
    RemoteClusterCreateReq:
      type: object
      properties:
        remote_cluster:
          $ref: '#/components/schemas/RemoteClusterCreateReq_RemoteCluster'
      title: RemoteClusterCreateReq
      example:
        remote_cluster:
          access_token: access_token
          url: url
    RemoteCluster:
      type: object
      properties:
        access_token:
          type: string
        block_snapshot_num:
          type: integer
          format: int64
        block_volume_num:
          type: integer
          format: int64
        connected:
          type: boolean
        create:
          type: string
          format: date-time
        dp_site_num:
          type: integer
          format: int64
        fs_id:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        os_zone_num:
          type: integer
          format: int64
        status:
