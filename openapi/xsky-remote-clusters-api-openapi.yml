        url:
          type: string
        version:
          type: string
      title: RemoteCluster
      description: RemoteCluster remote clusters communicated via public API
      example:
        dp_site_num: 1
        block_volume_num: 6
        update: '2000-01-23T04:56:07.000+00:00'
        version: version
        os_zone_num: 5
        url: url
        access_token: access_token
        block_snapshot_num: 0
        connected: true
