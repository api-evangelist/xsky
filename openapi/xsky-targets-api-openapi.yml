swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths targets API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: targets
  description: 'TargetController Operations able targets

    '
paths:
  /targets/:
    get:
      tags:
      - targets
      description: List all targets in the cluster
      operationId: ListTargets
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: host_id
        in: query
        description: host id
        required: false
        type: integer
        format: int64
        x-exportParamName: HostId
      - name: access_path_id
        in: query
        description: access path id
        required: false
        type: integer
        format: int64
        x-exportParamName: AccessPathId
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/TargetsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    post:
      tags:
      - targets
      description: Create target
      operationId: CreateTarget
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: target
        description: target info
        required: true
        schema:
          $ref: '#/definitions/TargetCreateReq'
        x-exportParamName: Target
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/TargetResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /targets/{target_id}:
    delete:
      tags:
      - targets
      description: delete target
      operationId: DeleteTarget
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: target_id
        in: path
        description: target id
        required: true
        type: integer
        format: int64
        x-exportParamName: TargetId
      - name: force
        in: query
        description: force delete or not
        required: false
        type: boolean
        x-exportParamName: Force
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/TargetResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
