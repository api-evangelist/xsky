      operationId: ListOSExternalStorageClasses
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: os_policy_id
        in: query
        description: os policy id
        required: false
        x-exportParamName: OsPolicyId
        schema:
          type: integer
          format: int64
      - name: general_status
        in: query
        description: query records with active or error status
        required: false
        x-exportParamName: GeneralStatus
        schema:
          type: boolean
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassesResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List OS external storage classes
      x-summary-source: derived
    post:
      tags:
      - os-external-storage-classes
      description: Create os external storage class
      operationId: CreateExternalStorageClass
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSExternalStorageClassCreateReq'
        description: external storage class info
        required: true
      summary: Create external storage class
      x-summary-source: derived
  /os-external-storage-classes/{external_storage_class_id}:
    get:
      tags:
      - os-external-storage-classes
      description: Get a os external storage class
      operationId: GetOSExternalStorageClass
      parameters:
      - name: external_storage_class_id
        in: path
        description: external storage class id
        required: true
        x-exportParamName: ExternalStorageClassId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get OS external storage class
      x-summary-source: derived
    delete:
