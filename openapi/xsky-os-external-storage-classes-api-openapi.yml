          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassResp'
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete OS external storage class
      x-summary-source: derived
    patch:
      tags:
      - os-external-storage-classes
      description: update os external storage class
      operationId: UpdateOSExternalStorageClass
      parameters:
      - name: external_storage_class_id
        in: path
        description: external storage class id
        required: true
        x-exportParamName: ExternalStorageClassId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSExternalStorageClassResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSExternalStorageClassUpdateReq'
        description: external storage class info
        required: true
      summary: Update OS external storage class
      x-summary-source: derived
