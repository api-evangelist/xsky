          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudPlatformResp'
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Sync cloud platform
      x-summary-source: derived
