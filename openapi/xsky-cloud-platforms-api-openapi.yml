      description: Sync a cloud platform
      operationId: SyncCloudPlatform
      parameters:
      - name: cloud_platform_id
        in: path
        description: cloud platform id
        required: true
        x-exportParamName: CloudPlatformId
        schema:
          type: integer
          format: int64
