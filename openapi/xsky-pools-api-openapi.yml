        used_percent: 9.018348186070783
        recovery_num: 7
  PlacementNode:
    type: object
    properties:
      create:
        type: string
        format: date-time
        description: time of creating placement node
      id:
        type: integer
        format: int64
        description: id of placement node
      name:
        type: string
        description: name of placement node
      parent:
        description: parent of placement node
        $ref: '#/definitions/PlacementNode'
      properties:
        description: properties for this placement node like is_witness
        $ref: '#/definitions/PlacementNodeProperties'
      type:
        type: string
        description: type of placement node
      update:
        type: string
        format: date-time
        description: time of updating placement node
    title: PlacementNode
    description: PlacementNode defines a placement node managing a range of hosts
    example:
      parent: null
      name: name
      create: '2000-01-23T04:56:07.000+00:00'
      update: '2000-01-23T04:56:07.000+00:00'
      id: 6
      type: type
      properties:
        is_witness: true
  PoolRuleReq:
    type: object
    properties:
      placement_node_id:
        type: integer
        format: int64
      replicate_num:
        type: integer
        format: int64
    title: PoolRuleReq
    example:
      placement_node_id: 2
      replicate_num: 7
  RawMessage:
    type: array
    description: 'RawMessage is a raw encoded JSON value. It implements Marshaler and Unmarshaler

      and can be used to delay JSON decoding or precompute a JSON encoding.'
    items:
      type: string
      format: byte
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
  ProtectionDomain_Nestview:
    type: object
    properties:
      id:
        type: integer
        format: int64
        description: id of protection domain
      name:
        type: string
        description: name of protection domain
    title: ProtectionDomain_Nestview
    example:
      name: name
      id: 5
  PredictionPoint:
    type: object
    properties:
      create:
        type: string
        format: date-time
      used_kbyte:
        type: integer
        format: int64
    title: PredictionPoint
    description: PredictionPoint is a point in a prediction graph
    example:
      used_kbyte: 5
      create: '2000-01-23T04:56:07.000+00:00'
  PoolsResp:
    type: object
    required:
    - pools
    properties:
      pools:
        type: array
        description: pools
        items:
          $ref: '#/definitions/PoolRecord'
    title: PoolsResp
    example:
      pools:
      - ''
      - ''
  PlacementNodeProperties:
    type: object
    properties:
      is_witness:
        type: boolean
        description: whether this is a witness node
    title: PlacementNodeProperties
    description: PlacementNodeProperties contains properties for a placement node.
    example:
      is_witness: true
  PoolPredictionsResp:
    type: object
    required:
    - pool_predictions
    properties:
      pool_predictions:
        type: array
        description: pool predictions
        items:
          $ref: '#/definitions/PoolPrediction'
    title: PoolPredictionsResp
    example:
      pool_predictions:
      - used_kbyte_30days: 2
        data_kbyte_1day: 0
        used_kbyte_7days: 7
        used_kbyte_points:
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        data_kbyte_7days: 1
        used_kbyte_1day: 5
        create: '2000-01-23T04:56:07.000+00:00'
        data_kbyte_points:
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        id: 5
        data_kbyte_30days: 6
      - used_kbyte_30days: 2
        data_kbyte_1day: 0
        used_kbyte_7days: 7
        used_kbyte_points:
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        data_kbyte_7days: 1
        used_kbyte_1day: 5
        create: '2000-01-23T04:56:07.000+00:00'
        data_kbyte_points:
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        - used_kbyte: 5
          create: '2000-01-23T04:56:07.000+00:00'
        id: 5
        data_kbyte_30days: 6
  PoolUpdateReq:
    type: object
    required:
    - pool
    properties:
      pool:
        $ref: '#/definitions/PoolUpdateReq_Pool'
    title: PoolUpdateReq
    example:
      pool:
        failure_domain_type: failure_domain_type
        io_bypass_enabled: true
        qos:
          mode: 5
          bandwidth: 0
          bandwidth_max: 6
          id: 5
          client_threshold: 1
          recovery_rate_type: recovery_rate_type
        size: 5
        name: name
        property:
          key: ''
        ruleset:
        - placement_node_id: 2
          replicate_num: 7
        - placement_node_id: 2
          replicate_num: 7
        primary_placement_node_id: 1
        default_managed_volume_format: 0
        io_bypass_threshold: 6
  PoolResp:
    type: object
    required:
    - pool
    properties:
      pool:
        description: pool
        $ref: '#/definitions/PoolRecord'
    title: PoolResp
    example:
      pool: ''
  OsdQos:
    type: object
    properties:
      bandwidth:
        type: integer
        format: int64
