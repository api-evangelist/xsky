swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths pools API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: pools
  description: 'PoolController Operations about Pools

    '
paths:
  /pools/:
    get:
      tags:
      - pools
      description: List pools
      operationId: ListPools
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: all
        in: query
        description: show all pools
        required: false
        type: boolean
        x-exportParamName: All
      - name: protection_domain_id
        in: query
        description: protection domain id
        required: false
        type: integer
        format: int64
        x-exportParamName: ProtectionDomainId
      - name: compound_osd_only
        in: query
        description: filter pool with only compound osds
        required: false
        type: boolean
        x-exportParamName: CompoundOsdOnly
      - name: osd_group_id
        in: query
        description: osd group id
        required: false
        type: integer
        format: int64
        x-exportParamName: OsdGroupId
      - name: pool_type
        in: query
        description: filter pool by type
        required: false
        type: string
        x-exportParamName: PoolType
      - name: pool_role
        in: query
        description: filter pool by role
        required: false
        type: string
        x-exportParamName: PoolRole
      - name: pool_mode
        in: query
        description: filter pool by pool_mode
        required: false
        type: string
        x-exportParamName: PoolMode
      - name: stretched
        in: query
        description: filter stretched pool
        required: false
        type: boolean
        x-exportParamName: Stretched
      - name: with_compound
        in: query
        description: with compound pool
        required: false
        type: boolean
        x-exportParamName: WithCompound
      - name: os_policy_id
        in: query
        description: filter data pool by object storage policy id
        required: false
        type: integer
        format: int64
        x-exportParamName: OsPolicyId
      - name: storage_class_id
        in: query
        description: filter data pool by os storage class id
        required: false
        type: integer
        format: int64
        x-exportParamName: StorageClassId
      - name: storage_class_pool_type
        in: query
        description: storage class pool type(active inactive) to query
        required: false
        type: string
        x-exportParamName: StorageClassPoolType
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    post:
      tags:
      - pools
      description: Create pool
      operationId: CreatePool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: the pool info
        required: true
        schema:
          $ref: '#/definitions/PoolCreateReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}:
    get:
      tags:
      - pools
      description: get pool
      operationId: GetPool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
    delete:
      tags:
      - pools
      description: Delete pool
      operationId: DeletePool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      - name: force
        in: query
        description: force delete or not
        required: false
        type: boolean
        x-exportParamName: Force
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/PoolResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - pools
      description: update pool info
      operationId: UpdatePool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      - in: body
        name: body
        description: pool info
        required: true
        schema:
          $ref: '#/definitions/PoolUpdateReq'
        x-exportParamName: Body
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}/osds:
    put:
      tags:
      - pools
      description: Add osds to pool
      operationId: AddOsdsToPool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      - in: body
        name: body
        description: osd infos
        required: true
        schema:
          $ref: '#/definitions/OsdsAddReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    delete:
      tags:
      - pools
      description: Remove multiple osds from a pool
      operationId: RemoveOsdsFromPool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      - in: body
        name: body
        description: osd infos
        required: true
        schema:
          $ref: '#/definitions/OsdsRemoveReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}/predictions:
    get:
      tags:
      - pools
      description: get a pool's prediction
      operationId: GetPoolPredictions
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolPredictionsResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}/samples:
    get:
      tags:
      - pools
      description: get pool's samples
      operationId: GetPoolSamples
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      - name: duration_begin
        in: query
        description: duration begin timestamp
        required: false
        type: string
        x-exportParamName: DurationBegin
      - name: duration_end
        in: query
        description: duration end timestamp
        required: false
        type: string
        x-exportParamName: DurationEnd
      - name: period
        in: query
        description: samples period
        required: false
        type: string
        x-exportParamName: Period
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolSamplesResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}/topology:
    get:
      tags:
      - pools
      description: get pool topology
      operationId: GetPoolTopology
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolTopologyResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}:disable-device-type-check:
    post:
      tags:
      - pools
      description: Disable device type check when add osd
      operationId: DisableDeviceTypeCheck
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}:enable-device-type-check:
    post:
      tags:
      - pools
      description: Enable device type check when add osd
      operationId: EnableDeviceTypeCheck
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}:reweight:
    post:
      tags:
      - pools
      description: Reweight a pool
      operationId: ReweightPool
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /pools/{pool_id}:switch-role:
    post:
      tags:
      - pools
      description: Switch pool role to compound
      operationId: SwitchPoolRole
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: pool_id
        in: path
        description: pool id
        required: true
        type: integer
        format: int64
        x-exportParamName: PoolId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PoolResp'
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/PoolResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
definitions:
  PoolTopologyResp:
    type: object
    required:
    - pool_topology
    properties:
      pool_topology:
        description: pool topology
        $ref: '#/definitions/PoolPlacementNode'
    title: PoolTopologyResp
    example:
      pool_topology:
        children:
        - null
        - null
        create: '2000-01-23T04:56:07.000+00:00'
        replicate_num: 1
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        placement_node:
          parent: null
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 6
          type: type
          properties:
            is_witness: true
        status: status
  PoolUpdateReq_Pool:
    type: object
    properties:
      default_managed_volume_format:
        type: integer
        format: int64
        description: 'default managed volume format: 128 or 129'
      failure_domain_type:
        type: string
      io_bypass_enabled:
        type: boolean
      io_bypass_threshold:
        type: integer
        format: int64
      name:
        type: string
      primary_placement_node_id:
        type: integer
        format: int64
      property:
        type: object
        additionalProperties:
          $ref: '#/definitions/RawMessage'
      qos:
        $ref: '#/definitions/OsdQos'
      ruleset:
        type: array
        items:
          $ref: '#/definitions/PoolRuleReq'
      size:
        type: integer
        format: int64
    title: PoolUpdateReq_Pool
    example:
      failure_domain_type: failure_domain_type
      io_bypass_enabled: true
      qos:
        mode: 5
        bandwidth: 0
        bandwidth_max: 6
        id: 5
        client_threshold: 1
        recovery_rate_type: recovery_rate_type
      size: 5
      name: name
      property:
        key: ''
      ruleset:
      - placement_node_id: 2
        replicate_num: 7
      - placement_node_id: 2
        replicate_num: 7
      primary_placement_node_id: 1
      default_managed_volume_format: 0
      io_bypass_threshold: 6
  PoolRecord:
    title: PoolRecord
    allOf:
    - $ref: '#/definitions/Pool'
    - properties:
        samples:
          type: array
          items:
            $ref: '#/definitions/PoolStat'
    description: PoolRecord is used to combine Pool and PoolStat to let API comfortable
  OsdsRemoveReq:
    type: object
    required:
    - osd_ids
    properties:
      osd_ids:
        type: array
        items:
          type: integer
          format: int64
    title: OsdsRemoveReq
    example:
      osd_ids:
      - 0
      - 0
  PoolSamplesResp:
    type: object
    required:
    - pool_samples
    properties:
      pool_samples:
        type: array
        description: pool samples
        items:
          $ref: '#/definitions/PoolStat'
    title: PoolSamplesResp
    example:
      pool_samples:
      - healthy_percent: 9.301444243932576
        error_kbyte: 2
        recovery_percent: 1.1730742509559433
        total_bandwidth_kbyte: 4.965218492984954
        read_latency_us: 1.0246457001441578
        data_kbyte: 1
        read_bandwidth_kbyte: 7.386281948385884
