openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Fs User Groups API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: fs-user-groups
  description: FSUserGroupController provides APIs for file storage user group
paths:
  /fs-user-groups/:
    get:
      tags:
      - fs-user-groups
      description: List file storage user groups
      operationId: ListFSUserGroups
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: type
        in: query
        description: security type of file storage user group
        required: false
        x-exportParamName: Type_
        schema:
          type: string
      - name: fs_user_id
        in: query
        description: file storage user id
        required: false
        x-exportParamName: FsUserId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupsResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List FS user groups
      x-summary-source: derived
    post:
      tags:
      - fs-user-groups
      description: Create file storage user group
      operationId: CreateFSUserGroup
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSUserGroupCreateReq'
        description: user group info
        required: true
      summary: Create FS user group
      x-summary-source: derived
  /fs-user-groups/{fs_user_group_id}:
    get:
      tags:
      - fs-user-groups
      description: Get file storage user group
      operationId: GetFSUserGroup
      parameters:
      - name: fs_user_group_id
        in: path
        description: user group id
        required: true
        x-exportParamName: FsUserGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get FS user group
      x-summary-source: derived
    delete:
      tags:
      - fs-user-groups
      description: delete file storage user group
      operationId: DeleteFSUserGroup
      parameters:
      - name: fs_user_group_id
        in: path
        description: user group id
        required: true
        x-exportParamName: FsUserGroupId
        schema:
          type: integer
          format: int64
      responses:
        204:
          description: Not Content
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete FS user group
      x-summary-source: derived
    patch:
      tags:
      - fs-user-groups
      description: Update file storage user group
      operationId: UpdateFSUserGroup
      parameters:
      - name: fs_user_group_id
        in: path
        description: user group id
        required: true
        x-exportParamName: FsUserGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSUserGroupUpdateReq'
        description: user group info
        required: true
      summary: Update FS user group
      x-summary-source: derived
  /fs-user-groups/{fs_user_group_id}/fs-users:
    put:
      tags:
      - fs-user-groups
      description: add users to file storage user group
      operationId: AddFSUsers
      parameters:
      - name: fs_user_group_id
        in: path
        description: user group id
        required: true
        x-exportParamName: FsUserGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSUserGroupAddUsersReq'
        description: users info
        required: true
      summary: Add FS users
      x-summary-source: derived
    delete:
      tags:
      - fs-user-groups
      description: remove users from file storage user group
      operationId: RemoveFSUsers
      parameters:
      - name: fs_user_group_id
        in: path
        description: user group id
        required: true
        x-exportParamName: FsUserGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSUserGroupResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSUserGroupRemoveUsersReq'
        description: users info
        required: true
      summary: Remove FS users
      x-summary-source: derived
components:
  schemas:
    FSUserGroupsResp:
      type: object
      required:
      - fs_user_groups
      properties:
        fs_user_groups:
          type: array
          description: file storage user groups
          items:
            $ref: '#/components/schemas/FSUserGroup'
      title: FSUserGroupsResp
      example:
        fs_user_groups:
        - user_num: 6
          fs_users:
          - name: name
            id: 6
          - name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
        - user_num: 6
          fs_users:
          - name: name
            id: 6
          - name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
    FSUserGroupRemoveUsersReq:
      type: object
      required:
      - fs_user_group
      properties:
        fs_user_group:
          $ref: '#/components/schemas/FSUserGroupRemoveUsersReq_UserGroup'
      title: FSUserGroupRemoveUsersReq
    FSUserGroupCreateReq:
      type: object
      required:
      - fs_user_group
      properties:
        fs_user_group:
          $ref: '#/components/schemas/FSUserGroupCreateReq_UserGroup'
      title: FSUserGroupCreateReq
    FSUser_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSUser_Nestview
      example:
        name: name
        id: 6
    FSUserGroupResp:
      type: object
      required:
      - fs_user_group
      properties:
        fs_user_group:
          description: file storage user group
          $ref: '#/components/schemas/FSUserGroup'
      title: FSUserGroupResp
      example:
        fs_user_group:
          user_num: 6
          fs_users:
          - name: name
            id: 6
          - name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
    FSUserGroupUpdateReq_UserGroup:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: name of user group
      title: FSUserGroupUpdateReq_UserGroup
    FSUserGroupUpdateReq:
      type: object
      required:
      - fs_user_group
      properties:
        fs_user_group:
          $ref: '#/components/schemas/FSUserGroupUpdateReq_UserGroup'
      title: FSUserGroupUpdateReq
    FSUserGroupRemoveUsersReq_UserGroup:
      type: object
      properties:
        fs_user_ids:
          type: array
          description: ids of users, which are required when type is smb or ftp
          items:
            type: integer
            format: int64
      title: FSUserGroupRemoveUsersReq_UserGroup
    FSUserGroupCreateReq_UserGroup:
      type: object
      required:
      - name
      properties:
        fs_user_ids:
          type: array
          description: ids of users, which are required when type is smb or ftp
          items:
            type: integer
            format: int64
        name:
          type: string
          description: name of user group
      title: FSUserGroupCreateReq_UserGroup
    FSUserGroup:
      type: object
      properties:
        action_status:
          type: string
        create:
          type: string
          format: date-time
        fs_users:
          type: array
          items:
            $ref: '#/components/schemas/FSUser_Nestview'
        id:
          type: integer
          format: int64
        name:
          type: string
        update:
          type: string
          format: date-time
        user_num:
          type: integer
          format: int64
      title: FSUserGroup
      description: FSUserGroup defines model of file storage user group
      example:
        user_num: 6
        fs_users:
        - name: name
          id: 6
        - name: name
          id: 6
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        action_status: action_status
    FSUserGroupAddUsersReq_UserGroup:
      type: object
      properties:
        fs_user_ids:
          type: array
          description: ids of users, which are required when type is smb or ftp
          items:
            type: integer
            format: int64
      title: FSUserGroupAddUsersReq_UserGroup
    FSUserGroupAddUsersReq:
      type: object
      required:
      - fs_user_group
      properties:
        fs_user_group:
          $ref: '#/components/schemas/FSUserGroupAddUsersReq_UserGroup'
      title: FSUserGroupAddUsersReq
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
