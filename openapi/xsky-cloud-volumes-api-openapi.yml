openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Cloud Volumes API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: cloud-volumes
  description: CloudVolumeController Cloud Volume Management
paths:
  /cloud-volumes/:
    get:
      tags:
      - cloud-volumes
      operationId: ListCloudVolumes
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: cloud_instance_id
        in: query
        description: cloud instance id
        required: false
        x-exportParamName: CloudInstanceId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudVolumesResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List cloud volumes
      x-summary-source: derived
  /cloud-volumes/{cloud_volume_id}:
    get:
      tags:
      - cloud-volumes
      description: Get a cloud volume
      operationId: GetCloudVolume
      parameters:
      - name: cloud_volume_id
        in: path
        description: cloud volume id
        required: true
        x-exportParamName: CloudVolumeId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudVolumeResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Get cloud volume
      x-summary-source: derived
components:
