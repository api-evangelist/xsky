    CloudDatacenter_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: CloudDatacenter_Nestview
      example:
        name: name
        id: 0
    CloudVolumeResp:
      type: object
      properties:
        cloud_volume:
          description: cloud volume
          $ref: '#/components/schemas/CloudVolume'
      title: CloudVolumeResp
      example:
        cloud_volume:
          cloud_volume_id: cloud_volume_id
          cloud_datacenter:
            name: name
            id: 0
          cloud_platform:
            name: name
            id: 6
            type: type
          block_volume:
            original_name: original_name
            name: name
            id: 9
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          multi_attach: true
          id: 1
