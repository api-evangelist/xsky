        cloud_volume_id: cloud_volume_id
        cloud_datacenter:
          name: name
          id: 0
        cloud_platform:
          name: name
          id: 6
          type: type
        block_volume:
          original_name: original_name
          name: name
          id: 9
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
