openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Fs Ftp Shares API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: fs-ftp-shares
  description: FSFTPShareController provides API for fs ftp share
paths:
  /fs-ftp-shares/:
    get:
      tags:
      - fs-ftp-shares
      description: List fs ftp shares
      operationId: ListFSFTPShares
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: fs_folder_id
        in: query
        description: fs smb id
        required: false
        x-exportParamName: FsFolderId
        schema:
          type: integer
          format: int64
      - name: fs_gateway_group_id
        in: query
        description: fs gateway group id
        required: false
        x-exportParamName: FsGatewayGroupId
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPSharesResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List FSFTP shares
      x-summary-source: derived
    post:
      tags:
      - fs-ftp-shares
      description: Create fs ftp share
      operationId: CreateFSFTPShare
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSFTPShareCreateReq'
        description: share info
        required: true
      summary: Create FSFTP share
      x-summary-source: derived
  /fs-ftp-shares/{fs_ftp_share_id}:
    get:
      tags:
      - fs-ftp-shares
      description: Get fs ftp share
      operationId: GetFSFTPShare
      parameters:
      - name: fs_ftp_share_id
        in: path
        description: share id
        required: true
        x-exportParamName: FsFtpShareId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get FSFTP share
      x-summary-source: derived
    delete:
      tags:
      - fs-ftp-shares
      description: delete fs ftp share
      operationId: DeleteFSFTPShare
      parameters:
      - name: fs_ftp_share_id
        in: path
        description: share id
        required: true
        x-exportParamName: FsFtpShareId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force delete or not
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete FSFTP share
      x-summary-source: derived
  /fs-ftp-shares/{fs_ftp_share_id}:add-acls:
    post:
      tags:
      - fs-ftp-shares
      description: Add fs ftp share acls
      operationId: AddFSFTPShareACLs
      parameters:
      - name: fs_ftp_share_id
        in: path
        description: fs ftp share id
        required: true
        x-exportParamName: FsFtpShareId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSFTPShareAddACLsReq'
        description: ftp share acls info
        required: true
      summary: Add FSFTP share ACLs
      x-summary-source: derived
  /fs-ftp-shares/{fs_ftp_share_id}:remove-acls:
    post:
      tags:
      - fs-ftp-shares
      description: remove fs ftp share acls
      operationId: RemoveFSFTPShareACLs
      parameters:
      - name: fs_ftp_share_id
        in: path
        description: fs ftp share id
        required: true
        x-exportParamName: FsFtpShareId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSFTPShareRemoveACLsReq'
        description: share acls info
        required: true
      summary: Remove FSFTP share ACLs
      x-summary-source: derived
  /fs-ftp-shares/{fs_ftp_share_id}:update-acls:
    post:
      tags:
      - fs-ftp-shares
      description: Update fs ftp share acls
      operationId: UpdateFSFTPShareACLs
      parameters:
      - name: fs_ftp_share_id
        in: path
        description: ftp share id
        required: true
        x-exportParamName: FsFtpShareId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSFTPShareResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSFTPShareUpdateACLsReq'
        description: ftp share acls info
        required: true
      summary: Update FSFTP share ACLs
      x-summary-source: derived
components:
  schemas:
    FSGatewayGroup_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        vip:
          type: string
        vip_mask:
          type: integer
          format: int64
      title: FSGatewayGroup_Nestview
      example:
        name: name
        id: 6
        vip_mask: 1
        vip: vip
    FSFTPShareCreateReq:
      type: object
      required:
      - fs_ftp_share
      properties:
        fs_ftp_share:
          $ref: '#/components/schemas/FSFTPShareCreateReq_Share'
      title: FSFTPShareCreateReq
    FSFolder_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSFolder_Nestview
      example:
        name: name
        id: 6
    FSFTPShareUpdateACLReq:
      type: object
      properties:
        create_enabled:
          type: boolean
          description: enable creating files
        delete_enabled:
          type: boolean
          description: enable deleting files
        download_bandwidth:
          type: integer
          format: int64
          description: max bandwidth of downloading
        download_enabled:
          type: boolean
          description: enable downloading files
        id:
          type: integer
          format: int64
          description: id of user group
        list_enabled:
          type: boolean
          description: enable listing files
        rename_enabled:
          type: boolean
          description: enable renaming files
        upload_bandwidth:
          type: integer
          format: int64
          description: max bandwidth of uploading
        upload_enabled:
          type: boolean
          description: enable uploading files
      title: FSFTPShareUpdateACLReq
    FSFTPShareAddACLsReq:
      type: object
      required:
      - fs_ftp_share
      properties:
        fs_ftp_share:
          $ref: '#/components/schemas/FSFTPShareAddACLsReq_Share'
      title: FSFTPShareAddACLsReq
    FSFTPShareRemoveACLsReq:
      type: object
      required:
      - fs_ftp_share
      properties:
        fs_ftp_share:
          $ref: '#/components/schemas/FSFTPShareRemoveACLsReq_Share'
      title: FSFTPShareRemoveACLsReq
    FSFTPShareCreateReq_Share:
      type: object
      required:
      - fs_folder_id
      - fs_gateway_group_id
      properties:
        fs_folder_id:
          type: integer
          format: int64
          description: folder id
        fs_ftp_share_acls:
          type: array
          description: access control array
          items:
            $ref: '#/components/schemas/FSFTPShareACLReq'
        fs_gateway_group_id:
          type: integer
          format: int64
          description: gateway group id
        fs_quota_tree_id:
          type: integer
          format: int64
          description: quota tree id
        name:
          type: string
          description: name of share
      title: FSFTPShareCreateReq_Share
    FSFTPShareRemoveACLsReq_Share:
      type: object
      required:
      - fs_ftp_share_acl_ids
      properties:
        fs_ftp_share_acl_ids:
          type: array
          description: access control array
          items:
            type: integer
            format: int64
      title: FSFTPShareRemoveACLsReq_Share
    FSFTPShareUpdateACLsReq_Share:
      type: object
      properties:
        fs_ftp_share_acls:
          type: array
          description: access control array
          items:
            $ref: '#/components/schemas/FSFTPShareUpdateACLReq'
      title: FSFTPShareUpdateACLsReq_Share
    FSFTPShareAddACLsReq_Share:
      type: object
      required:
      - fs_ftp_share_acls
      properties:
        fs_ftp_share_acls:
          type: array
          description: access control array
          items:
            $ref: '#/components/schemas/FSFTPShareACLReq'
      title: FSFTPShareAddACLsReq_Share
    FSFTPShareResp:
      type: object
      required:
      - fs_ftp_share
      properties:
        fs_ftp_share:
          description: fs ftp share
          $ref: '#/components/schemas/FSFTPShare'
      title: FSFTPShareResp
      example:
        fs_ftp_share:
          mapping_num: 2
          fs_folder:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          fs_quota_tree:
            name: name
            id: 5
          update: '2000-01-23T04:56:07.000+00:00'
          acl_num: 0
          id: 5
          fs_gateway_group:
            name: name
            id: 6
            vip_mask: 1
            vip: vip
          action_status: action_status
          status: status
    FSQuotaTree_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSQuotaTree_Nestview
      example:
        name: name
        id: 5
    FSFTPShareACLReq:
      type: object
      properties:
        create_enabled:
          type: boolean
          description: enable creating files
        delete_enabled:
          type: boolean
          description: enable deleting files
        download_bandwidth:
          type: integer
          format: int64
          description: max bandwidth of downloading
        download_enabled:
          type: boolean
          description: enable downloading files
        fs_user_group_id:
          type: integer
          format: int64
          description: id of user group
        fs_user_id:
          type: integer
          format: int64
          description: id of user
        id:
          type: integer
          format: int64
          description: id of user group
        list_enabled:
          type: boolean
          description: enable listing files
        rename_enabled:
          type: boolean
          description: enable renaming files
        type:
          type: string
          description: type of share acl
        upload_bandwidth:
          type: integer
          format: int64
          description: max bandwidth of uploading
        upload_enabled:
          type: boolean
          description: enable uploading files
      title: FSFTPShareACLReq
    FSFTPShare:
      type: object
      properties:
        acl_num:
          type: integer
          format: int64
        action_status:
          type: string
        create:
          type: string
          format: date-time
        fs_folder:
          $ref: '#/components/schemas/FSFolder_Nestview'
        fs_gateway_group:
          $ref: '#/components/schemas/FSGatewayGroup_Nestview'
        fs_quota_tree:
          $ref: '#/components/schemas/FSQuotaTree_Nestview'
        id:
          type: integer
          format: int64
        mapping_num:
          type: integer
          format: int64
        status:
          type: string
        update:
          type: string
          format: date-time
      title: FSFTPShare
      description: FSFTPShare defines model of fs ftp share
      example:
        mapping_num: 2
        fs_folder:
          name: name
          id: 6
        create: '2000-01-23T04:56:07.000+00:00'
        fs_quota_tree:
          name: name
          id: 5
        update: '2000-01-23T04:56:07.000+00:00'
        acl_num: 0
        id: 5
        fs_gateway_group:
          name: name
          id: 6
          vip_mask: 1
          vip: vip
        action_status: action_status
        status: status
    FSFTPShareUpdateACLsReq:
      type: object
      required:
      - fs_ftp_share
      properties:
        fs_ftp_share:
          $ref: '#/components/schemas/FSFTPShareUpdateACLsReq_Share'
      title: FSFTPShareUpdateACLsReq
    FSFTPSharesResp:
      type: object
      required:
      - fs_ftp_shares
      properties:
        fs_ftp_shares:
          type: array
          description: fs ftp share
          items:
            $ref: '#/components/schemas/FSFTPShare'
      title: FSFTPSharesResp
      example:
        fs_ftp_shares:
        - mapping_num: 2
          fs_folder:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          fs_quota_tree:
            name: name
            id: 5
          update: '2000-01-23T04:56:07.000+00:00'
          acl_num: 0
          id: 5
          fs_gateway_group:
            name: name
            id: 6
            vip_mask: 1
            vip: vip
          action_status: action_status
          status: status
        - mapping_num: 2
          fs_folder:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          fs_quota_tree:
            name: name
            id: 5
          update: '2000-01-23T04:56:07.000+00:00'
          acl_num: 0
          id: 5
          fs_gateway_group:
            name: name
            id: 6
            vip_mask: 1
            vip: vip
          action_status: action_status
          status: status
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
