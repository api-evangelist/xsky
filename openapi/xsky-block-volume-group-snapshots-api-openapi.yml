        update:
          type: string
          format: date-time
      title: VolumeGroupSnapshot
      description: VolumeGroupSnapshot defines the model of volume group snapshot
      example:
        block_snapshot_num: 0
        cloned_block_volume_group_num: 1
        block_volume_group:
