          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupSnapshotResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupSnapshotResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
