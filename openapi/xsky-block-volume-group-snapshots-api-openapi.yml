        required: true
        x-exportParamName: BlockVolumeGroupSnapshotId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupSnapshotResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeGroupSnapshotUpdateReq'
        description: volume group snapshot info
        required: true
      summary: Update block volume group snapshot
      x-summary-source: derived
