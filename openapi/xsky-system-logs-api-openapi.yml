openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS System Logs API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: System Logs
  description: SystemLogController provides API for system logs
paths:
  /system-logs/:
    get:
      tags:
      - System Logs
      operationId: ListSystemLogs
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: host_id
        in: query
        description: The id of host system logs belong to
        required: true
        x-exportParamName: HostId
        schema:
          type: integer
          format: int64
      - name: catalog
        in: query
        description: The name of catalog system logs belong to
        required: true
        x-exportParamName: Catalog
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogsResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List system logs
      x-summary-source: derived
  /system-logs/archive:
    get:
      tags:
      - System Logs
      description: download system logs
      operationId: DownloadSystemLogs
      responses:
        200:
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        204:
          description: No Content
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Download system logs
      x-summary-source: derived
