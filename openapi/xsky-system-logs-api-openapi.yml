          format: int64
        last_updated_time:
          type: string
          format: date-time
        name:
          type: string
        size:
          type: integer
          format: int64
      title: SystemLog
      description: SystemLog defines the system log
      example:
        last_updated_time: '2000-01-23T04:56:07.000+00:00'
        size: 9
        catalog: catalog
        host:
          roles: roles
