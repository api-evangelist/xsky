      - dp-gateways
      description: Update a dp gateway
      operationId: UpdateDpGateway
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: gateway_id
        in: path
        description: dp gateway id
        required: true
        type: integer
        format: int64
        x-exportParamName: GatewayId
      - in: body
