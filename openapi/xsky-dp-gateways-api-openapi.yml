        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
definitions:
  DpGatewayCreateReq_Gateway:
    type: object
    required:
    - host_id
    - name
    properties:
      host_id:
        type: integer
        format: int64
      name:
        type: string
    title: DpGatewayCreateReq_Gateway
    example:
      name: name
      host_id: 0
  DpGateway:
    type: object
    properties:
      admin_port:
        type: integer
        format: int64
      create:
        type: string
        format: date-time
      gateway_port:
        type: integer
        format: int64
      host:
        $ref: '#/definitions/Host_Nestview'
      id:
        type: integer
        format: int64
      name:
        type: string
      status:
        type: string
      update:
        type: string
        format: date-time
    title: DpGateway
    description: DpGateway is a process to execute data protection jobs
    example:
      admin_port: 0
      gateway_port: 6
      host:
        name: name
        admin_ip: admin_ip
        id: 0
      name: name
      create: '2000-01-23T04:56:07.000+00:00'
      update: '2000-01-23T04:56:07.000+00:00'
      id: 1
      status: status
  Host_Nestview:
    type: object
    required:
    - admin_ip
    properties:
      admin_ip:
        type: string
      id:
        type: integer
        format: int64
      name:
        type: string
    title: Host_Nestview
    example:
      name: name
      admin_ip: admin_ip
      id: 0
  DpGatewayUpdateReq_Gateway:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: dp gateway name
    title: DpGatewayUpdateReq_Gateway
    example:
      name: name
  DpGatewayUpdateReq:
    type: object
    properties:
      dp_gateway:
        $ref: '#/definitions/DpGatewayUpdateReq_Gateway'
    title: DpGatewayUpdateReq
    example:
      dp_gateway:
        name: name
  DpGatewayResp:
    type: object
    required:
    - dp_gateway
    properties:
      dp_gateway:
        description: dp gateway
        $ref: '#/definitions/DpGateway'
    title: DpGatewayResp
    example:
      dp_gateway:
        admin_port: 0
        gateway_port: 6
        host:
          name: name
          admin_ip: admin_ip
          id: 0
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 1
        status: status
  DpGatewaysResp:
    type: object
    required:
    - dp_gateways
    properties:
      dp_gateways:
        type: array
        description: dp gateways
        items:
          $ref: '#/definitions/DpGateway'
    title: DpGatewaysResp
    example:
      dp_gateways:
      - admin_port: 0
        gateway_port: 6
        host:
          name: name
          admin_ip: admin_ip
          id: 0
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 1
        status: status
      - admin_port: 0
        gateway_port: 6
        host:
          name: name
          admin_ip: admin_ip
          id: 0
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 1
        status: status
  DpGatewayCreateReq:
    type: object
    properties:
      dp_gateway:
        $ref: '#/definitions/DpGatewayCreateReq_Gateway'
    title: DpGatewayCreateReq
    example:
      dp_gateway:
        name: name
        host_id: 0
securityDefinitions:
  tokenInHeader:
    description: auth by token
    type: apiKey
    name: Xms-Auth-Token
    in: header
  tokenInQuery:
    description: auth by token
    type: apiKey
    name: token
    in: query
