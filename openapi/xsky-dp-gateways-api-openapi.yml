        in: path
        description: dp gateway id
        required: true
        type: integer
        format: int64
        x-exportParamName: GatewayId
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/DpGatewayResp'
        404:
          description: NotFound
