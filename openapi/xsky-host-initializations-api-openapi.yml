    title: HostInitializationResp
    example:
      host_initialization:
        hostname_prefix: hostname_prefix
        disable_firewalld: true
        set_hostname: true
        create: '2000-01-23T04:56:07.000+00:00'
        id: 0
        message: message
        admin_ips:
        - admin_ips
        - admin_ips
        ssh_user: ssh_user
        status: status
  HostInitializationReq:
    type: object
    properties:
      host_initialization:
