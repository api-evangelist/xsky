        type: string
        format: date-time
      disable_firewalld:
        type: boolean
      hostname_prefix:
        type: string
      id:
        type: integer
        format: int64
      message:
        type: string
      set_hostname:
        type: boolean
      ssh_user:
        type: string
      status:
        type: string
    title: HostInitialization
    description: HostInitialization is the model of host initialization
    example:
      hostname_prefix: hostname_prefix
      disable_firewalld: true
      set_hostname: true
      create: '2000-01-23T04:56:07.000+00:00'
      id: 0
      message: message
      admin_ips:
      - admin_ips
      - admin_ips
      ssh_user: ssh_user
      status: status
  HostInitializationResp:
    type: object
    properties:
      host_initialization:
