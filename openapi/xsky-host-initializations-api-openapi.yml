    title: HostInitializationReq
    example:
      host_initialization:
        hostname_prefix: hostname_prefix
        disable_firewalld: true
        set_hostname: true
        ssh_password: ssh_password
        admin_ips:
        - admin_ips
        - admin_ips
        ssh_user: ssh_user
  HostInitializationReq_Initialization:
    type: object
    required:
    - admin_ips
    - ssh_user
    properties:
      admin_ips:
        type: array
        items:
          type: string
      disable_firewalld:
        type: boolean
      hostname_prefix:
        type: string
      set_hostname:
        type: boolean
      ssh_password:
        type: string
      ssh_user:
        type: string
    title: HostInitializationReq_Initialization
    example:
      hostname_prefix: hostname_prefix
      disable_firewalld: true
      set_hostname: true
      ssh_password: ssh_password
      admin_ips:
      - admin_ips
      - admin_ips
      ssh_user: ssh_user
