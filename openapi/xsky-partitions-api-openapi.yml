swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths partitions API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: partitions
  description: 'PartitionController API /partitions.

    '
paths:
  /partitions/:
    get:
      tags:
      - partitions
      description: List partitions
      operationId: ListPartitions
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      - name: host_id
        in: query
        description: host id
        required: false
        type: integer
        format: int64
        x-exportParamName: HostId
      - name: disk_id
        in: query
        description: disk id
        required: false
        type: integer
        format: int64
        x-exportParamName: DiskId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PartitionsResp'
      security:
      - tokenInHeader: []
      - tokenInQuery: []
  /partitions/{partition_id}:
    get:
      tags:
      - partitions
      description: Get a partition info
      operationId: GetPartition
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: partition_id
        in: path
        description: partition id
        required: true
        type: string
        x-exportParamName: PartitionId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PartitionResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
