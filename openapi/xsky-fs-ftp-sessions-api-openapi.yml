        type: array
        description: fs ftp sessions
        items:
          $ref: '#/definitions/FSFTPSession'
    title: FSFTPSessionsResp
    example:
      fs_ftp_sessions:
      - client_port: 0
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        client_ip: client_ip
        connected_at: '2000-01-23T04:56:07.000+00:00'
        id: 1
        fs_ftp_share:
          id: 6
        username: username
      - client_port: 0
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        client_ip: client_ip
        connected_at: '2000-01-23T04:56:07.000+00:00'
        id: 1
        fs_ftp_share:
          id: 6
        username: username
  FSFTPSession:
