      id:
        type: integer
        format: int64
      update:
        type: string
        format: date-time
      username:
        type: string
    title: FSFTPSession
    description: FSFTPSession defines model of FS FTP session
    example:
      client_port: 0
      create: '2000-01-23T04:56:07.000+00:00'
      update: '2000-01-23T04:56:07.000+00:00'
      client_ip: client_ip
      connected_at: '2000-01-23T04:56:07.000+00:00'
      id: 1
      fs_ftp_share:
        id: 6
      username: username
