openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Dp Sites API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: dp-sites
  description: DpSiteController API /dp-sites/
paths:
  /dp-sites/:
    get:
      tags:
      - dp-sites
      description: List data protection sites
      operationId: ListDpSites
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: protection_type
        in: query
        description: protection type
        required: false
        x-exportParamName: ProtectionType
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpSitesResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List dp sites
      x-summary-source: derived
    post:
      tags:
      - dp-sites
      description: Create a data protection site
      operationId: CreateDpSite
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpSiteResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DpSiteCreateReq'
        description: dp site info
        required: true
      summary: Create dp site
      x-summary-source: derived
  /dp-sites/{site_id}:
    get:
      tags:
      - dp-sites
      description: Get data protection site
      operationId: GetDpSite
      parameters:
      - name: site_id
        in: path
        description: protection site id
        required: true
        x-exportParamName: SiteId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
