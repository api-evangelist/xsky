      host_role:
        type: string
      id:
        type: integer
        format: int64
      priority:
        type: integer
        format: int64
      retried:
        type: boolean
      retry:
        type: integer
        format: int64
      retry_type:
        type: string
      status:
        type: string
      type:
        type: string
      update:
        type: string
        format: date-time
    title: Task
    description: Task defines a task will be run on a host @grpc-models-proto
    example:
      retried: true
      error_msg: error_msg
      data: data
      update: '2000-01-23T04:56:07.000+00:00'
      priority: 5
      type: type
      execute: '2000-01-23T04:56:07.000+00:00'
      host_role: host_role
      host:
        name: name
