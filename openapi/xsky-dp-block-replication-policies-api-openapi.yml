components:
  schemas:
    DpBlockReplicationPolicyUpdateReq:
      type: object
      required:
      - dp_block_replication_policy
      properties:
        dp_block_replication_policy:
          $ref: '#/components/schemas/DpBlockReplicationPolicyUpdateReq_Policy'
      title: DpBlockReplicationPolicyUpdateReq
      example:
        dp_block_replication_policy:
          name: name
          timeout_seconds: 0
    DpBlockReplicationPolicy:
      type: object
      properties:
        create:
          type: string
          format: date-time
        dp_site:
          $ref: '#/components/schemas/DpSite_Nestview'
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        timeout_seconds:
          type: integer
          format: int64
        update:
          type: string
          format: date-time
      title: DpBlockReplicationPolicy
      description: DpBlockReplicationPolicy protects a block volume by sync replication
      example:
        dp_site:
          name: name
          id: 1
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        timeout_seconds: 6
        status: status
    DpSite_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: DpSite_Nestview
      example:
        name: name
        id: 1
    DpBlockReplicationPolicyCreateReq_Policy:
      type: object
      required:
      - dp_site_id
      - name
      - timeout_seconds
      properties:
        dp_site_id:
          type: integer
          format: int64
          description: protection site id
        name:
          type: string
          description: name
        timeout_seconds:
          type: integer
          format: int64
          description: replication timeout seconds
      title: DpBlockReplicationPolicyCreateReq_Policy
      example:
        name: name
        dp_site_id: 0
        timeout_seconds: 6
    DpBlockReplicationPolicyCreateReq:
      type: object
      required:
      - dp_block_replication_policy
      properties:
        dp_block_replication_policy:
          $ref: '#/components/schemas/DpBlockReplicationPolicyCreateReq_Policy'
      title: DpBlockReplicationPolicyCreateReq
      example:
        dp_block_replication_policy:
          name: name
          dp_site_id: 0
          timeout_seconds: 6
    DpBlockReplicationPolicyUpdateReq_Policy:
      type: object
      properties:
        name:
          type: string
          description: name
        timeout_seconds:
          type: integer
          format: int64
          description: replication timeout seconds
      title: DpBlockReplicationPolicyUpdateReq_Policy
      example:
        name: name
        timeout_seconds: 0
    DpBlockReplicationPoliciesResp:
      type: object
      properties:
        dp_block_replication_policies:
          type: array
          items:
            $ref: '#/components/schemas/DpBlockReplicationPolicy'
      title: DpBlockReplicationPoliciesResp
      example:
        dp_block_replication_policies:
        - dp_site:
            name: name
            id: 1
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          timeout_seconds: 6
          status: status
        - dp_site:
            name: name
            id: 1
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          timeout_seconds: 6
          status: status
    DpBlockReplicationPolicyResp:
      type: object
      properties:
        dp_block_replication_policy:
          $ref: '#/components/schemas/DpBlockReplicationPolicy'
      title: DpBlockReplicationPolicyResp
      example:
        dp_block_replication_policy:
          dp_site:
            name: name
            id: 1
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          timeout_seconds: 6
          status: status
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
