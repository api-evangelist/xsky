      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: access_path_id
        in: query
        description: access path id
        required: false
        type: integer
        format: int64
        x-exportParamName: AccessPathId
      - name: client_group_id
        in: query
        description: client group id
        required: false
        type: integer
        format: int64
        x-exportParamName: ClientGroupId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/MappingGroupsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    post:
      tags:
      - mapping-groups
      description: create a mapping group in access path
      operationId: CreateMappingGroup
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: mapping_group
        description: mapping info
        required: true
        schema:
          $ref: '#/definitions/MappingGroupCreateReq'
        x-exportParamName: MappingGroup
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/MappingGroupResp'
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/MappingGroupResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
  /mapping-groups/{mapping_group_id}:
    get:
      tags:
      - mapping-groups
      description: Get mapping group by id
      operationId: GetMappingGroup
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: mapping_group_id
        in: path
