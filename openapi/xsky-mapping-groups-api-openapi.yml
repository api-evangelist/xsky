      - tokenInHeader: []
definitions:
  MappingGroupResp:
    type: object
    required:
    - mapping_group
    properties:
      mapping_group:
        $ref: '#/definitions/MappingGroup'
    title: MappingGroupResp
    example:
      mapping_group:
        client_group:
          name: name
          id: 5
        access_path:
          name: name
          id: 0
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 6
        status: status
  MappingGroupReq:
    type: object
    properties:
      access_path_id:
        type: integer
        format: int64
      block_volume_ids:
        type: array
        items:
          type: integer
          format: int64
      client_group_id:
        type: integer
        format: int64
    title: MappingGroupReq
    example:
      client_group_id: 5
      block_volume_ids:
      - 1
      - 1
      access_path_id: 6
  MappingGroupsResp:
    type: object
    required:
    - mapping_groups
    properties:
      mapping_groups:
        type: array
        items:
          $ref: '#/definitions/MappingGroup'
    title: MappingGroupsResp
    example:
      mapping_groups:
      - client_group:
          name: name
          id: 5
        access_path:
          name: name
          id: 0
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 6
        status: status
      - client_group:
          name: name
          id: 5
        access_path:
          name: name
          id: 0
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 6
        status: status
  MappingGroup:
    type: object
    properties:
      access_path:
        $ref: '#/definitions/AccessPath_Nestview'
      client_group:
        $ref: '#/definitions/ClientGroup_Nestview'
      create:
        type: string
        format: date-time
      id:
        type: integer
        format: int64
      status:
        type: string
      update:
        type: string
        format: date-time
    title: MappingGroup
    description: MappingGroup defines the mapping group of volumes and client groups
    example:
      client_group:
        name: name
        id: 5
      access_path:
        name: name
        id: 0
      create: '2000-01-23T04:56:07.000+00:00'
      update: '2000-01-23T04:56:07.000+00:00'
      id: 6
      status: status
  MappingGroupAddVolumesReq:
    type: object
    required:
    - block_volume_ids
    properties:
      block_volume_ids:
        type: array
        items:
          type: integer
          format: int64
    title: MappingGroupAddVolumesReq
    example:
      block_volume_ids:
      - 0
      - 0
  MappingGroupRemoveVolumesReq:
    type: object
    required:
    - block_volume_ids
    properties:
      block_volume_ids:
        type: array
        items:
          type: integer
          format: int64
    title: MappingGroupRemoveVolumesReq
    example:
      block_volume_ids:
      - 0
      - 0
  AccessPath_Nestview:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
    title: AccessPath_Nestview
    example:
      name: name
      id: 0
  MappingGroupUpdateReq_MappingGroup:
    type: object
    properties:
      block_volume_ids:
        type: array
        items:
          type: integer
          format: int64
    title: MappingGroupUpdateReq_MappingGroup
    example:
      block_volume_ids:
      - 0
      - 0
  MappingGroupCreateReq:
    type: object
    required:
    - mapping_group
    properties:
      mapping_group:
        $ref: '#/definitions/MappingGroupReq'
    title: MappingGroupCreateReq
    example:
      mapping_group:
