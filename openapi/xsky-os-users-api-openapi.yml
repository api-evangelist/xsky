      - tokenInQuery: []
      - tokenInHeader: []
    delete:
      tags:
      - os-users
      description: delete object storage user
      operationId: DeleteObjectStorageUser
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: user_id
        in: path
        description: user id
        required: true
        type: integer
        format: int64
        x-exportParamName: UserId
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageUserResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - os-users
      description: update object storage user
      operationId: UpdateObjectStorageUser
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: user_id
        in: path
        description: user id
        required: true
        type: integer
        format: int64
        x-exportParamName: UserId
      - in: body
        name: body
        description: user info
        required: true
        schema:
          $ref: '#/definitions/ObjectStorageUserUpdateReq'
        x-exportParamName: Body
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ObjectStorageUserResp'
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageUserResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /os-users/{user_id}/samples:
    get:
