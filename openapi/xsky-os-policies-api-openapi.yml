      properties:
        os_policies:
          type: array
          description: object storage policies
          items:
            $ref: '#/components/schemas/ObjectStoragePolicy'
      title: ObjectStoragePoliciesResp
      example:
        os_policies:
        - shared: true
          cache_pool:
            name: name
            id: 5
          compress: true
          description: description
          policy_name: policy_name
          update: '2000-01-23T04:56:07.000+00:00'
          bucket_num: 0
          crypto: true
          index_pool:
            name: name
            id: 5
          object_size_threshold: 1
          default: true
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          id: 6
          status: status
        - shared: true
          cache_pool:
            name: name
            id: 5
          compress: true
          description: description
          policy_name: policy_name
          update: '2000-01-23T04:56:07.000+00:00'
          bucket_num: 0
          crypto: true
          index_pool:
            name: name
            id: 5
          object_size_threshold: 1
          default: true
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          id: 6
          status: status
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
