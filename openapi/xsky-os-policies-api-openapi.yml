        name:
          type: string
        object_size_threshold:
          type: integer
          format: int64
        policy_name:
          type: string
        shared:
          type: boolean
        status:
          type: string
        update:
          type: string
          format: date-time
      title: ObjectStoragePolicy
      description: ObjectStoragePolicy is the model of object_storage_policy
      example:
        shared: true
        cache_pool:
          name: name
          id: 5
        compress: true
        description: description
        policy_name: policy_name
        update: '2000-01-23T04:56:07.000+00:00'
        bucket_num: 0
        crypto: true
        index_pool:
          name: name
          id: 5
        object_size_threshold: 1
        default: true
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        id: 6
        status: status
    ObjectStoragePolicyCreateReq:
      type: object
      properties:
        os_policy:
          $ref: '#/components/schemas/ObjectStoragePolicyCreateReq_Policy'
      title: ObjectStoragePolicyCreateReq
      example:
        os_policy:
          shared: true
          storage_classes:
          - active_pool_ids:
            - 1
            - 1
            name: name
            description: description
            class: 5
            inactive_pool_ids:
            - 5
            - 5
          - active_pool_ids:
            - 1
            - 1
            name: name
            description: description
            class: 5
            inactive_pool_ids:
            - 5
            - 5
          cache_pool_id: 0
          compress: true
          name: name
          description: description
          index_pool_id: 6
          crypto: true
    ObjectStoragePoliciesResp:
      type: object
      required:
