          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        description: type of file storage gateway group
        required: false
        x-exportParamName: Type_
        schema:
          type: string
      - name: security
        in: query
        description: security of file storage gateway group
        required: false
        x-exportParamName: Security
        schema:
          type: string
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSGatewayGroupsResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List FS gateway groups
      x-summary-source: derived
    post:
      tags:
      - fs-gateway-groups
      description: Create file storage gateway group
      operationId: CreateFSGatewayGroup
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSGatewayGroupResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSGatewayGroupCreateReq'
        description: gateway group info
        required: true
      summary: Create FS gateway group
      x-summary-source: derived
  /fs-gateway-groups/{fs_gateway_group_id}:
