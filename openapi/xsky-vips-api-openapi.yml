openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Vips API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: vips
  description: VIPController API /vips
paths:
  /vips/:
    get:
      tags:
      - vips
      description: List vips
      operationId: ListVIPs
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: vip_group_id
        in: query
        description: vip_group id
        required: false
        x-exportParamName: VipGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VIPsResp'
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List VIPs
      x-summary-source: derived
    post:
      tags:
      - vips
      description: Create a vip
      operationId: CreateVIP
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VIPResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VIPCreateReq'
        description: vip info
        required: true
      summary: Create VIP
      x-summary-source: derived
  /vips/{vip_id}:
    get:
      tags:
      - vips
      description: Get a vip
      operationId: GetVIP
      parameters:
      - name: vip_id
        in: path
        description: vip id
        required: true
        x-exportParamName: VipId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VIPResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get VIP
      x-summary-source: derived
    delete:
      tags:
      - vips
      description: Delete a vip
      operationId: DeleteVIP
      parameters:
      - name: vip_id
        in: path
        description: vip id
        required: true
        x-exportParamName: VipId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VIPResp'
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete VIP
      x-summary-source: derived
    patch:
      tags:
      - vips
      description: Update a vip
      operationId: UpdateVIP
      parameters:
      - name: vip_id
        in: path
        description: vip id
        required: true
        x-exportParamName: VipId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VIPResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Update VIP
      x-summary-source: derived
components:
  schemas:
    VIPInstance_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
      title: VIPInstance_Nestview
    VIPRecord:
      title: VIPRecord
      allOf:
      - $ref: '#/components/schemas/VIP'
      - properties:
          current_vip_instance:
            $ref: '#/components/schemas/VIPInstance_Nestview'
          default_vip_instance:
            description: 'Copy these two fields from corresponding fields of VIP to avoid JSON marshal

              recursion.'
            $ref: '#/components/schemas/VIPInstance_Nestview'
      description: VIPRecord represents doc returned by API.
    VIPGroup_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        network:
          type: string
        resource_id:
          type: integer
          format: int64
        resource_type:
          type: string
      title: VIPGroup_Nestview
    VIPCreateReq_VIP:
      type: object
      required:
      - ip
      - network_address_id
      - vip_group_id
      properties:
        ip:
          type: string
        mask:
          type: integer
          format: int64
        network_address_id:
          type: integer
          format: int64
        vip_group_id:
          type: integer
          format: int64
      title: VIPCreateReq_VIP
    VIPCreateReq:
      type: object
      required:
      - vip
      properties:
        vip:
          $ref: '#/components/schemas/VIPCreateReq_VIP'
      title: VIPCreateReq
    VIP:
      type: object
      properties:
        action_status:
          type: string
        create:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        ip:
          type: string
        mac_address:
          type: string
        mask:
          type: integer
          format: int64
        status:
          type: string
        update:
          type: string
          format: date-time
        vip_group:
          $ref: '#/components/schemas/VIPGroup_Nestview'
        virtual_router_id:
          type: integer
          format: int64
      title: VIP
      description: VIP is a virtual IP provided access to resources.
    VIPsResp:
      type: object
      properties:
        vips:
          type: array
          items:
            $ref: '#/components/schemas/VIPRecord'
      title: VIPsResp
      example:
        vips:
        - ''
        - ''
    VIPResp:
      type: object
      properties:
        vip:
          $ref: '#/components/schemas/VIPRecord'
      title: VIPResp
      example:
        vip: ''
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
