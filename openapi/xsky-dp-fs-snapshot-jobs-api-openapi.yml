openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Dp Fs Snapshot Jobs API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: dp-fs-snapshot-jobs
  description: DpFSSnapshotJobController API /dp-fs-snapshot-jobs/
paths:
  /dp-fs-snapshot-jobs/:
    get:
      tags:
      - dp-fs-snapshot-jobs
      description: List dp fs snapshot jobs
      operationId: ListDpFSSnapshotJobs
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: fs_folder_id
        in: query
        description: fs folder
        required: false
        x-exportParamName: FsFolderId
        schema:
          type: integer
          format: int64
      - name: fs_snapshot_id
        in: query
        description: fs snapshot
        required: false
        x-exportParamName: FsSnapshotId
        schema:
          type: integer
          format: int64
      - name: dp_fs_snapshot_policy_id
        in: query
        description: dp fs snapshot policy
        required: false
        x-exportParamName: DpFsSnapshotPolicyId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpFSSnapshotJobsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List dp FS snapshot jobs
      x-summary-source: derived
  /dp-fs-snapshot-jobs/{job_id}:
    get:
      tags:
      - dp-fs-snapshot-jobs
      description: Get dp fs snapshot job
      operationId: GetDpFSSnapshotJob
      parameters:
      - name: job_id
        in: path
        description: resource id
        required: true
        x-exportParamName: JobId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpFSSnapshotJobResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get dp FS snapshot job
      x-summary-source: derived
components:
  schemas:
    DpFSSnapshotJobsResp:
      type: object
      properties:
        dp_fs_snapshot_jobs:
          type: array
          items:
            $ref: '#/components/schemas/DpFSSnapshotJob'
      title: DpFSSnapshotJobsResp
      example:
        dp_fs_snapshot_jobs:
        - finished_at: '2000-01-23T04:56:07.000+00:00'
          size: 2
          updated_at: '2000-01-23T04:56:07.000+00:00'
          fs_folder:
            name: name
            id: 6
          dp_fs_snapshot_policy:
            name: name
            id: 0
          progress: 5.637376656633329
          started_at: '2000-01-23T04:56:07.000+00:00'
          fs_snapshot:
            name: name
            id: 1
          id: 5
          status: status
        - finished_at: '2000-01-23T04:56:07.000+00:00'
          size: 2
          updated_at: '2000-01-23T04:56:07.000+00:00'
          fs_folder:
            name: name
            id: 6
          dp_fs_snapshot_policy:
            name: name
            id: 0
          progress: 5.637376656633329
          started_at: '2000-01-23T04:56:07.000+00:00'
          fs_snapshot:
            name: name
            id: 1
          id: 5
          status: status
    FSFolder_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSFolder_Nestview
      example:
        name: name
        id: 6
    DpFSSnapshotJob:
      type: object
      properties:
        dp_fs_snapshot_policy:
          $ref: '#/components/schemas/DpFSSnapshotPolicy_Nestview'
        finished_at:
          type: string
          format: date-time
        fs_folder:
          $ref: '#/components/schemas/FSFolder_Nestview'
        fs_snapshot:
          $ref: '#/components/schemas/FSSnapshot_Nestview'
        id:
          type: integer
          format: int64
        progress:
          type: number
          format: double
        size:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        status:
          type: string
        updated_at:
          type: string
          format: date-time
      title: DpFSSnapshotJob
      description: DpFSSnapshotJob is one execution of a running dp fs snapshot policy
      example:
        finished_at: '2000-01-23T04:56:07.000+00:00'
        size: 2
        updated_at: '2000-01-23T04:56:07.000+00:00'
        fs_folder:
          name: name
          id: 6
        dp_fs_snapshot_policy:
          name: name
          id: 0
        progress: 5.637376656633329
        started_at: '2000-01-23T04:56:07.000+00:00'
        fs_snapshot:
          name: name
          id: 1
        id: 5
        status: status
    DpFSSnapshotPolicy_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: DpFSSnapshotPolicy_Nestview
      example:
        name: name
        id: 0
    FSSnapshot_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSSnapshot_Nestview
      example:
        name: name
        id: 1
    DpFSSnapshotJobResp:
      type: object
      properties:
        dp_fs_snapshot_job:
          $ref: '#/components/schemas/DpFSSnapshotJob'
      title: DpFSSnapshotJobResp
      example:
        dp_fs_snapshot_job:
          finished_at: '2000-01-23T04:56:07.000+00:00'
          size: 2
          updated_at: '2000-01-23T04:56:07.000+00:00'
          fs_folder:
            name: name
            id: 6
          dp_fs_snapshot_policy:
            name: name
            id: 0
          progress: 5.637376656633329
          started_at: '2000-01-23T04:56:07.000+00:00'
          fs_snapshot:
            name: name
            id: 1
          id: 5
          status: status
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
