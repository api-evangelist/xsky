      - model
      - vendor
      properties:
        enclosures:
          type: array
          description: host enclosures
          items:
            $ref: '#/components/schemas/Enclosure'
        model:
          type: string
          description: host model
        vendor:
          type: string
          description: host vendor
      title: HostEncSpecCreateReq_HostEncSpec
      example:
        vendor: vendor
        model: model
        enclosures:
        - start_slot: 1
          slot_num: 6
          ids:
          - 0
          - 0
          position: position
          order: order
        - start_slot: 1
          slot_num: 6
          ids:
          - 0
          - 0
          position: position
          order: order
    HostEncSpec:
      type: object
      properties:
        create:
          type: string
          format: date-time
        enclosures:
          type: array
          items:
            $ref: '#/components/schemas/Enclosure'
        id:
          type: integer
          format: int64
        model:
          type: string
        update:
          type: string
          format: date-time
        vendor:
          type: string
      title: HostEncSpec
      description: HostEncSpec defines host enclosure specification
      example:
        vendor: vendor
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        model: model
        id: 5
        enclosures:
        - start_slot: 1
          slot_num: 6
          ids:
          - 0
          - 0
          position: position
          order: order
        - start_slot: 1
          slot_num: 6
          ids:
          - 0
          - 0
