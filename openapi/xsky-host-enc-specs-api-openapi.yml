            order: order
    HostEncSpecCreateReq:
      type: object
      properties:
        host_enc_spec:
          $ref: '#/components/schemas/HostEncSpecCreateReq_HostEncSpec'
      title: HostEncSpecCreateReq
      example:
        host_enc_spec:
          vendor: vendor
          model: model
          enclosures:
          - start_slot: 1
            slot_num: 6
            ids:
            - 0
            - 0
            position: position
            order: order
          - start_slot: 1
            slot_num: 6
            ids:
            - 0
            - 0
            position: position
            order: order
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
