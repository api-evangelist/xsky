openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Fs Smb Share Acls API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: fs-smb-share-acls
  description: FSSMBShareACLController provides API for fs smb share acl
paths:
  /fs-smb-share-acls/:
    get:
      tags:
      - fs-smb-share-acls
      description: List fs smb share acls
      operationId: ListFSSMBShareACLs
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: fs_smb_share_id
        in: query
        description: fs smb share id
        required: false
        x-exportParamName: FsSmbShareId
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSMBShareACLsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List FSSMB share ACLs
      x-summary-source: derived
components:
  schemas:
    FSSMBShare_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSSMBShare_Nestview
      example:
        name: name
        id: 6
    FSUserGroup_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSUserGroup_Nestview
      example:
        name: name
        id: 1
    FSSMBShareACLsResp:
      type: object
      required:
      - fs_smb_share_acls
      properties:
        fs_smb_share_acls:
          type: array
          description: file storage folder share acls
          items:
            $ref: '#/components/schemas/FSSMBShareACL'
      title: FSSMBShareACLsResp
      example:
        fs_smb_share_acls:
        - fs_smb_share:
            name: name
            id: 6
          fs_user_name: fs_user_name
          fs_user_group:
            name: name
            id: 1
          fs_user:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          permission: permission
          id: 0
          type: type
          fs_user_group_name: fs_user_group_name
        - fs_smb_share:
            name: name
            id: 6
          fs_user_name: fs_user_name
          fs_user_group:
            name: name
            id: 1
          fs_user:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          permission: permission
          id: 0
          type: type
          fs_user_group_name: fs_user_group_name
    FSUser_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSUser_Nestview
      example:
        name: name
        id: 6
    FSSMBShareACL:
      type: object
      properties:
        create:
          type: string
          format: date-time
        fs_smb_share:
          $ref: '#/components/schemas/FSSMBShare_Nestview'
        fs_user:
          $ref: '#/components/schemas/FSUser_Nestview'
        fs_user_group:
          $ref: '#/components/schemas/FSUserGroup_Nestview'
        fs_user_group_name:
          type: string
        fs_user_name:
          type: string
        id:
          type: integer
          format: int64
        permission:
          type: string
        type:
          type: string
        update:
          type: string
          format: date-time
      title: FSSMBShareACL
      description: FSSMBShareACL defines model of fs smb share ACL
      example:
        fs_smb_share:
          name: name
          id: 6
        fs_user_name: fs_user_name
        fs_user_group:
          name: name
          id: 1
        fs_user:
          name: name
          id: 6
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        permission: permission
        id: 0
        type: type
        fs_user_group_name: fs_user_group_name
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
