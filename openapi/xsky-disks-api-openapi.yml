      title: Host_Nestview
      example:
        name: name
        admin_ip: admin_ip
        id: 0
    DiskUpdateReq:
      type: object
      required:
      - disk
      properties:
        disk:
          $ref: '#/components/schemas/DiskUpdateReq_Disk'
      title: DiskUpdateReq
      example:
        disk:
          power_safe: true
          disk_type: disk_type
          lighting_status: lighting_status
    Disk_Nestview:
      type: object
      properties:
        device:
          type: string
        disk_type:
          type: string
        id:
          type: integer
          format: int64
      title: Disk_Nestview
      example:
        disk_type: disk_type
        id: 0
        device: device
