openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Disks API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: Disks
  description: DiskController Disk Management
paths:
  /disks/:
    get:
      tags:
      - Disks
      description: List all pyhsical disks in the system
      operationId: ListDisks
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: host_id
        in: query
        description: host id
        required: false
        x-exportParamName: HostId
        schema:
          type: integer
          format: int64
      - name: is_cache
        in: query
        description: filter cache disk
        required: false
        x-exportParamName: IsCache
        schema:
          type: boolean
      - name: used
        in: query
        description: filter used
        required: false
        x-exportParamName: Used
        schema:
          type: boolean
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisksResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List disks
      x-summary-source: derived
  /disks/{disk_id}:
    get:
      tags:
      - Disks
      description: Get a disk
      operationId: GetDisk
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        x-exportParamName: DiskId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get disk
      x-summary-source: derived
    patch:
      tags:
      - Disks
      description: update disk info
      operationId: UpdateDisk
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        x-exportParamName: DiskId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskUpdateReq'
        description: disk info
        required: true
      summary: Update disk
      x-summary-source: derived
  /disks/{disk_id}/partitions:
    put:
      tags:
      - Disks
      description: create cache partitions for disk
      operationId: CreatePartitions
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        x-exportParamName: DiskId
        schema:
          type: integer
          format: int64
      - name: num
        in: query
        description: num of partitions to create
        required: false
        x-exportParamName: Num
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionsCreateReq'
        description: partitions info
        required: true
      summary: Create partitions
      x-summary-source: derived
    delete:
      tags:
      - Disks
      description: delete cache partitions of disk
      operationId: DeletePartitions
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        x-exportParamName: DiskId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete partitions
      x-summary-source: derived
  /disks/{disk_id}/samples:
    get:
      tags:
      - Disks
      description: get a disk's samples
      operationId: GetDiskSamples
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        x-exportParamName: DiskId
        schema:
          type: integer
          format: int64
      - name: duration_begin
        in: query
        description: duration begin timestamp
        required: false
        x-exportParamName: DurationBegin
        schema:
          type: string
      - name: duration_end
        in: query
        description: duration end timestamp
        required: false
        x-exportParamName: DurationEnd
        schema:
          type: string
      - name: period
        in: query
        description: samples period
        required: false
        x-exportParamName: Period
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskSamplesResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Get disk samples
      x-summary-source: derived
