      omap_byte:
        type: integer
        format: int64
    title: PartitionsCreateReq_Partitions
    example:
      num: 0
      omap_byte: 6
  Host_Nestview:
    type: object
    required:
    - admin_ip
    properties:
      admin_ip:
        type: string
      id:
        type: integer
        format: int64
      name:
        type: string
    title: Host_Nestview
    example:
      name: name
      admin_ip: admin_ip
      id: 0
  DisksResp:
    type: object
    required:
    - disks
    properties:
      disks:
        type: array
        description: disks
        items:
          $ref: '#/definitions/DiskRecord'
    title: DisksResp
    example:
      disks:
      - ''
      - ''
  DiskUpdateReq:
    type: object
    required:
