swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths disks API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: disks
  description: 'DiskController Disk Management

    '
paths:
  /disks/:
    get:
      tags:
      - disks
      description: List all pyhsical disks in the system
      operationId: ListDisks
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: host_id
        in: query
        description: host id
        required: false
        type: integer
        format: int64
        x-exportParamName: HostId
      - name: is_cache
        in: query
        description: filter cache disk
        required: false
        type: boolean
        x-exportParamName: IsCache
      - name: used
        in: query
        description: filter used
        required: false
        type: boolean
        x-exportParamName: Used
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/DisksResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /disks/{disk_id}:
    get:
      tags:
      - disks
      description: Get a disk
      operationId: GetDisk
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        type: integer
        format: int64
        x-exportParamName: DiskId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/DiskResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - disks
      description: update disk info
      operationId: UpdateDisk
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        type: integer
        format: int64
        x-exportParamName: DiskId
      - in: body
        name: disk
        description: disk info
        required: true
        schema:
          $ref: '#/definitions/DiskUpdateReq'
        x-exportParamName: Disk
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /disks/{disk_id}/partitions:
    put:
      tags:
      - disks
      description: create cache partitions for disk
      operationId: CreatePartitions
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        type: integer
        format: int64
        x-exportParamName: DiskId
      - name: num
        in: query
        description: num of partitions to create
        required: false
        type: integer
        format: int64
        x-exportParamName: Num
      - in: body
        name: body
        description: partitions info
        required: true
        schema:
          $ref: '#/definitions/PartitionsCreateReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    delete:
      tags:
      - disks
      description: delete cache partitions of disk
      operationId: DeletePartitions
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        type: integer
        format: int64
        x-exportParamName: DiskId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/DiskResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /disks/{disk_id}/samples:
    get:
      tags:
      - disks
      description: get a disk's samples
      operationId: GetDiskSamples
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: disk_id
        in: path
        description: disk id
        required: true
        type: integer
        format: int64
        x-exportParamName: DiskId
      - name: duration_begin
        in: query
        description: duration begin timestamp
        required: false
        type: string
        x-exportParamName: DurationBegin
      - name: duration_end
        in: query
        description: duration end timestamp
        required: false
        type: string
        x-exportParamName: DurationEnd
      - name: period
        in: query
        description: samples period
        required: false
        type: string
        x-exportParamName: Period
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/DiskSamplesResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
