        format: int64
      name:
        type: string
      shared:
        type: boolean
      size:
        type: integer
        format: int64
      soft_quota_size:
        type: integer
        format: int64
      status:
        type: string
      update:
        type: string
        format: date-time
      used_kbyte:
        type: integer
        format: int64
    title: FSQuotaTree
    description: FSQuotaTree defines model of file storage quota tree
    example:
      shared: true
      used_kbyte: 5
      size: 6
      soft_quota_size: 1
      fs_folder:
        name: name
        id: 6
      name: name
      create: '2000-01-23T04:56:07.000+00:00'
      update: '2000-01-23T04:56:07.000+00:00'
      id: 0
