swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths fs-quota-trees API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: fs-quota-trees
  description: 'FSQuotaTreeController provides API for file storage quota tree

    '
paths:
  /fs-quota-trees/:
    get:
      tags:
      - fs-quota-trees
      description: List file storage quota trees
      operationId: ListQuotaTrees
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      - name: fs_folder_id
        in: query
        description: file storage folder id
        required: false
        type: integer
        format: int64
        x-exportParamName: FsFolderId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/FSQuotaTreesResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /fs-quota-trees/{fs_quota_tree_id}:
    get:
      tags:
      - fs-quota-trees
      description: Get file storage quota tree
      operationId: GetQuotaTree
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: fs_quota_tree_id
        in: path
        description: quota tree id
        required: true
        type: integer
        format: int64
        x-exportParamName: FsQuotaTreeId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/FSQuotaTreeResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - fs-quota-trees
      description: Update file storage quota tree
      operationId: UpdateQuotaTree
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: fs_quota_tree_id
        in: path
        description: quota tree id
        required: true
        type: integer
        format: int64
        x-exportParamName: FsQuotaTreeId
      - in: body
        name: body
        description: quota tree info
        required: true
        schema:
          $ref: '#/definitions/FSQuotaTreeUpdateReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/FSQuotaTreeResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
