        items:
          $ref: '#/definitions/FSQuotaTree'
    title: FSQuotaTreesResp
    example:
      fs_quota_trees:
      - shared: true
        used_kbyte: 5
        size: 6
        soft_quota_size: 1
        fs_folder:
          name: name
          id: 6
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
