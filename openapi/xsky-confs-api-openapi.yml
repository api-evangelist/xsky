openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Confs API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: confs
  description: ConfController Operations about Config
paths:
  /confs/:
    put:
      tags:
      - confs
      description: set conf item
      operationId: SetConfItem
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfItem'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfItemSetReq'
        description: conf item
        required: true
      summary: Set conf item
      x-summary-source: derived
  /confs/{type}:
    get:
      tags:
      - confs
      operationId: ListConfItems
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: type
        in: path
        description: filter the type of conf
        required: true
        x-exportParamName: Type_
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfItemsResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List conf items
      x-summary-source: derived
    put:
      tags:
      - confs
      description: set conf items
      operationId: SetConfItems
      parameters:
      - name: type
        in: path
        description: filter the type of conf
        required: true
        x-exportParamName: Type_
        schema:
          type: string
      responses:
        204:
          description: No Content
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfItemsSetReq'
        description: conf items
        required: true
      summary: Set conf items
      x-summary-source: derived
  /confs/{type}/{key}:
    get:
      tags:
      - confs
      description: get conf item
      operationId: GetConfItem
      parameters:
      - name: type
        in: path
        description: filter the type of conf
        required: true
        x-exportParamName: Type_
        schema:
          type: string
      - name: key
        in: path
        description: filter the key of conf item
        required: true
        x-exportParamName: Key
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfItemResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get conf item
      x-summary-source: derived
    delete:
      tags:
      - confs
      description: delete conf item
      operationId: DeleteConfItem
      parameters:
      - name: type
        in: path
        description: filter the type of conf item
        required: true
        x-exportParamName: Type_
        schema:
          type: string
      - name: key
        in: path
        description: filter the key of conf item
        required: true
        x-exportParamName: Key
        schema:
          type: string
      responses:
        204:
          description: No Content
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete conf item
      x-summary-source: derived
components:
  schemas:
    ConfItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        type:
          type: string
        value:
          type: string
      title: ConfItem
      description: ConfItem is a ceph config pair
      example:
        id: 0
        type: type
        value: value
        key: key
    ConfItemSetReq_ConfItem:
      type: object
      required:
      - key
      - type
      - value
      properties:
        key:
          type: string
        type:
          type: string
        value:
          type: string
      title: ConfItemSetReq_ConfItem
      example:
        type: type
        value: value
        key: key
    ConfItemResp:
      type: object
      required:
      - conf
      properties:
        conf:
          description: conf item
          $ref: '#/components/schemas/ConfItem'
      title: ConfItemResp
      example:
        conf:
          id: 0
          type: type
          value: value
          key: key
    ConfItemsSetReq:
      type: object
      required:
      - confs
      properties:
        confs:
          type: object
          additionalProperties:
            type: string
      title: ConfItemsSetReq
      example:
        confs:
          key: confs
    ConfItemSetReq:
      type: object
      required:
      - conf
      properties:
        conf:
          $ref: '#/components/schemas/ConfItemSetReq_ConfItem'
      title: ConfItemSetReq
      example:
        conf:
          type: type
          value: value
          key: key
    ConfItemsResp:
      type: object
      required:
      - confs
      properties:
        confs:
          type: array
          description: conf items
          items:
            $ref: '#/components/schemas/ConfItem'
      title: ConfItemsResp
      example:
        confs:
        - id: 0
          type: type
          value: value
          key: key
        - id: 0
          type: type
          value: value
          key: key
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
