    title: VIPInstancesResp
    example:
      vip_instances:
      - create: '2000-01-23T04:56:07.000+00:00'
        network_address:
          ip: ip
          id: 6
          mask: 1
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        priority: 6
        vip:
          ip: ip
          id: 1
          mask: 5
        action_status: action_status
        status: status
      - create: '2000-01-23T04:56:07.000+00:00'
        network_address:
          ip: ip
