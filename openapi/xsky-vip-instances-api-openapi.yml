swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths vip-instances API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: vip-instances
  description: 'VIPInstanceController API /vip-instances

    '
paths:
  /vip-instances/:
    get:
      tags:
      - vip-instances
      description: List vip instances
      operationId: ListVIPInstances
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: vip_id
        in: query
        description: vip id
        required: false
        type: integer
        format: int64
        x-exportParamName: VipId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VIPInstancesResp'
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /vip-instances/{vip_instance_id}:
    get:
      tags:
      - vip-instances
      description: Get a vip group
      operationId: GetVIPInstance
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: vip_instance_id
        in: path
        description: vip group id
        required: true
        type: integer
        format: int64
        x-exportParamName: VipInstanceId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VIPInstanceResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
