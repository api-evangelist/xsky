openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Block Volume Groups API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: block-volume-groups
  description: VolumeGroupController Operations about volume group
paths:
  /block-volume-groups/:
    get:
      tags:
      - block-volume-groups
      operationId: ListBlockVolumeGroups
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List block volume groups
      x-summary-source: derived
    post:
      tags:
      - block-volume-groups
      operationId: CreateBlockVolumeGroup
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeGroupCreateReq'
        description: volume group info
        required: true
      summary: Create block volume group
      x-summary-source: derived
  /block-volume-groups/{block_volume_group_id}:
    get:
      tags:
      - block-volume-groups
      description: get a block volume group
      operationId: GetBlockVolumeGroup
      parameters:
      - name: block_volume_group_id
        in: path
        description: block volume group id
        required: true
        x-exportParamName: BlockVolumeGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get block volume group
      x-summary-source: derived
    delete:
      tags:
      - block-volume-groups
      description: Delete a block volume group
      operationId: DeleteBlockVolumeGroup
      parameters:
      - name: block_volume_group_id
        in: path
        description: block volume group id
        required: true
        x-exportParamName: BlockVolumeGroupId
        schema:
          type: integer
          format: int64
      responses:
        204:
          description: No Content
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Delete block volume group
      x-summary-source: derived
    patch:
      tags:
      - block-volume-groups
      operationId: UpdateBlockVolumeGroup
      parameters:
      - name: block_volume_group_id
        in: path
        description: block volume group id
        required: true
        x-exportParamName: BlockVolumeGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeGroupUpdateReq'
        description: volume group info
        required: true
      summary: Update block volume group
      x-summary-source: derived
  /block-volume-groups/{block_volume_group_id}/block-volumes:
    put:
      tags:
      - block-volume-groups
      operationId: AddBlockVolumeToBlockVolumeGroup
      parameters:
      - name: block_volume_group_id
        in: path
        description: block volume group id
        required: true
        x-exportParamName: BlockVolumeGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeGroupAddVolumeReq'
        description: volume ids
        required: true
      summary: Add block volume to block volume group
      x-summary-source: derived
    delete:
      tags:
      - block-volume-groups
      operationId: RemoveBlockVolumeFromBlockVolumeGroup
      parameters:
      - name: block_volume_group_id
        in: path
        description: block volume group id
        required: true
        x-exportParamName: BlockVolumeGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeGroupResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeGroupRemoveVolumeReq'
        description: volume ids
        required: true
      summary: Remove block volume from block volume group
      x-summary-source: derived
components:
  schemas:
    VolumeGroupSnapshot_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: VolumeGroupSnapshot_Nestview
      example:
        name: name
        id: 6
    VolumeGroupAddVolumeReq:
      type: object
      required:
      - block_volume_ids
      properties:
        block_volume_ids:
          type: array
          items:
            type: integer
            format: int64
      title: VolumeGroupAddVolumeReq
      example:
        block_volume_ids:
        - 0
        - 0
    VolumeGroupUpdateReq:
      type: object
      required:
