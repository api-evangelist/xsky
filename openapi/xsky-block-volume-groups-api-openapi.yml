      title: VolumeGroupsResp
      example:
        block_volume_groups:
        - flattened: true
          block_volume_num: 6
          description: description
          update: '2000-01-23T04:56:07.000+00:00'
          latest_snapshot_time: '2000-01-23T04:56:07.000+00:00'
          block_volume_group_snapshot_num: 0
