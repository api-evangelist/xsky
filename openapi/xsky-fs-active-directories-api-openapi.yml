    title: FSActiveDirectoryCreateReq
  FSActiveDirectoriesResp:
    type: object
    required:
    - fs_active_directories
    properties:
      fs_active_directories:
        type: array
        description: file storage active directories
        items:
          $ref: '#/definitions/FSActiveDirectory'
    title: FSActiveDirectoriesResp
    example:
      fs_active_directories:
      - workgroup: workgroup
        ip: ip
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        fs_gateway_group_num: 0
        realm: realm
        id: 6
        verify_time: '2000-01-23T04:56:07.000+00:00'
        action_status: action_status
        status: status
        username: username
      - workgroup: workgroup
        ip: ip
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        fs_gateway_group_num: 0
        realm: realm
        id: 6
        verify_time: '2000-01-23T04:56:07.000+00:00'
        action_status: action_status
        status: status
        username: username
  FSActiveDirectoryResp:
    type: object
    required:
    - fs_active_directory
    properties:
      fs_active_directory:
        description: file storage active directory
        $ref: '#/definitions/FSActiveDirectory'
    title: FSActiveDirectoryResp
    example:
      fs_active_directory:
        workgroup: workgroup
        ip: ip
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        fs_gateway_group_num: 0
        realm: realm
        id: 6
        verify_time: '2000-01-23T04:56:07.000+00:00'
        action_status: action_status
        status: status
        username: username
  FSActiveDirectoryUpdateReq:
    type: object
    required:
    - fs_active_directory
    properties:
      fs_active_directory:
        $ref: '#/definitions/FSActiveDirectoryUpdateReq_Info'
