swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths clients API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: clients
  description: 'ClientController API /clients

    '
paths:
  /clients/:
    get:
      tags:
      - clients
      description: List clients
      operationId: ListClients
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: q
        in: query
        description: query param of search
        required: false
        type: string
        x-exportParamName: Q
      - name: sort
        in: query
        description: sort param of search
        required: false
        type: string
        x-exportParamName: Sort
      - name: client_group_id
        in: query
        description: client group id
        required: false
        type: integer
        format: int64
        x-exportParamName: ClientGroupId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ClientsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /clients/{client_id}:
    get:
      tags:
      - clients
      description: Get client
      operationId: GetClient
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: client_id
        in: path
        description: client id
        required: true
        type: integer
        format: int64
        x-exportParamName: ClientId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ClientResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
