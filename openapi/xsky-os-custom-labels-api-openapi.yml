openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Os Custom Labels API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: os-custom-labels
  description: OSCustomLabelController provides API for object storage custom label
paths:
  /os-custom-labels/:
    get:
      tags:
      - os-custom-labels
      description: List object storage custom labels
      operationId: ListOSCustomLabels
      parameters:
      - name: bucket_id
        in: query
        description: bucket id
        required: false
        x-exportParamName: BucketId
        schema:
          type: integer
          format: int64
      - name: category
        in: query
        description: 'label category: meta, default, tagging'
        required: false
        x-exportParamName: Category
        schema:
          type: string
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSCustomLabelsResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List OS custom labels
      x-summary-source: derived
  /os-custom-labels/{os_custom_label_id}:
    get:
      tags:
      - os-custom-labels
      description: Get object storage custom label
      operationId: GetOSCustomLabel
      parameters:
      - name: os_custom_label_id
        in: path
        description: os custom label id
        required: true
        x-exportParamName: OsCustomLabelId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSCustomLabelResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Get OS custom label
      x-summary-source: derived
components:
  schemas:
    ObjectStorageBucket_Nestview_lifecycle:
      properties:
        id:
          type: integer
          format: int64
        rules:
          type: array
          items:
            type: object
            properties: {}
        status:
          type: string
      example:
        rules:
        - '{}'
        - '{}'
        id: 6
        status: status
    OSCustomLabelResp:
      type: object
      required:
      - os_custom_label
      properties:
        os_custom_label:
          description: object storage custom label
          $ref: '#/components/schemas/OSCustomLabel'
      title: OSCustomLabelResp
      example:
        os_custom_label:
          bucket:
            lifecycle:
              rules:
              - '{}'
              - '{}'
              id: 6
              status: status
