        format: int64
      duration:
        type: integer
        format: int64
      duration_begin:
        type: string
        format: date-time
      duration_end:
        type: string
        format: date-time
      limit:
        type: integer
        format: int64
      next:
        type: string
      offset:
        type: integer
        format: int64
      period:
        type: string
      total_count:
        type: integer
        format: int64
      truncated:
        type: boolean
    title: Paging
    description: Paging defines paging object
    example:
      duration: 1
