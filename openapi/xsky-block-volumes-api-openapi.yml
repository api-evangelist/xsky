        schema:
          type: boolean
      - name: recycled
        in: query
        description: recycled or not
        required: false
        x-exportParamName: Recycled
        schema:
          type: boolean
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
