        access_key: access_key
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        type: type
        user:
          name: name
          id: 1
        status: status
  ObjectStorageKeyUpdateReq:
    type: object
    properties:
      os_key:
        $ref: '#/definitions/ObjectStorageKeyUpdateReq_Key'
    title: ObjectStorageKeyUpdateReq
    example:
