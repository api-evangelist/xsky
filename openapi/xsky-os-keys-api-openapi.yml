swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths os-keys API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: os-keys
  description: 'ObjectStorageKeyController provides API for object storage key

    '
paths:
  /os-keys/:
    get:
      tags:
      - os-keys
      description: List object storage keys
      operationId: ListKeys
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Limit
      - name: offset
        in: query
        description: paging param
        required: false
        type: integer
        format: int64
        x-exportParamName: Offset
      - name: user_id
        in: query
        description: object storage user id
        required: false
        type: integer
        format: int64
        x-exportParamName: UserId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ObjectStorageKeysResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    post:
      tags:
      - os-keys
      description: Create new object storage key
      operationId: CreateKey
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: key info
        required: true
        schema:
          $ref: '#/definitions/ObjectStorageKeyCreateReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageKeyResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /os-keys/{key_id}:
    get:
      tags:
      - os-keys
      description: get object storage key
      operationId: GetKey
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: key_id
        in: path
        description: user id
        required: true
        type: integer
        format: int64
        x-exportParamName: KeyId
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ObjectStorageKeyResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    delete:
      tags:
      - os-keys
      description: Delete object storage key
      operationId: DeleteKey
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: key_id
        in: path
        description: key id
        required: true
        type: integer
        format: int64
        x-exportParamName: KeyId
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageKeyResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - os-keys
      description: Update object storage key
      operationId: UpdateKey
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: key_id
        in: path
        description: key id
        required: true
        type: integer
        format: int64
        x-exportParamName: KeyId
      - in: body
        name: body
        description: key info
        required: true
        schema:
          $ref: '#/definitions/ObjectStorageKeyUpdateReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageKeyResp'
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
definitions:
