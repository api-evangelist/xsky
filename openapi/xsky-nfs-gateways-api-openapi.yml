        description:
          type: string
        gateway_ip:
          type: string
        host_id:
          type: integer
          format: int64
        name:
          type: string
        port:
          type: integer
          format: int64
      title: NFSGatewayCreateReq_NFSGateway
    NFSGateway:
      type: object
      properties:
        bucket_num:
          type: integer
          format: int64
        create:
          type: string
          format: date-time
        description:
          type: string
        gateway_ip:
          type: string
        gateway_name:
          type: string
        host:
          $ref: '#/components/schemas/Host_Nestview'
        id:
          type: integer
          format: int64
        mount_clients:
          type: string
        mount_num:
          type: integer
          format: int64
        name:
          type: string
        port:
          type: integer
          format: int64
        status:
          type: string
        update:
          type: string
          format: date-time
      title: NFSGateway
      description: NFSGateway defines nfs gateway @grpc-models-proto
    NFSGatewaysResp:
      type: object
      required:
      - nfs_gateways
      properties:
        nfs_gateways:
          type: array
