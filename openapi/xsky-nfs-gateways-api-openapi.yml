                $ref: '#/components/schemas/NFSGatewayBucketMapResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get NFS gateway bucket map
      x-summary-source: derived
    put:
      tags:
      - nfs-gateways
      description: add bucket to nfs gateway
      operationId: CreateNFSGatewayBucketMap
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: bucket_id
        in: path
        description: bucket id
        required: true
        x-exportParamName: BucketId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayBucketMapResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: Create NFS gateway bucket map
      x-summary-source: derived
    delete:
      tags:
      - nfs-gateways
      description: remove bucket from nfs gateway
      operationId: DeleteNFSGatewayBucketMap
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: bucket_id
        in: path
        description: bucket id
        required: true
        x-exportParamName: BucketId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force delete or no
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayBucketMapResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete NFS gateway bucket map
      x-summary-source: derived
    patch:
      tags:
      - nfs-gateways
      description: update nfs gateway bucket
      operationId: UpdateNFSGatewayBucketMap
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: bucket_id
        in: path
        description: bucket id
        required: true
        x-exportParamName: BucketId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force update bucket map
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayBucketMapResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayBucketMapResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFSGatewayBucketMapUpdateReq'
        description: nfs gateway bucket update info
        required: true
      summary: Update NFS gateway bucket map
      x-summary-source: derived
  /nfs-gateways/{gateway_id}/samples:
    get:
      tags:
