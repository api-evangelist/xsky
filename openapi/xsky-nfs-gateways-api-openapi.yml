openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Nfs Gateways API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: nfs-gateways
  description: NFSGatewayController provides API for object storage nfs gateway
paths:
  /nfs-gateways/:
    get:
      tags:
      - nfs-gateways
      description: List all nfs gateways
      operationId: ListNFSGateways
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewaysResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List NFS gateways
      x-summary-source: derived
    post:
      tags:
      - nfs-gateways
      description: create nfs gateway
      operationId: CreateNFSGateway
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFSGatewayCreateReq'
        description: nfs gateway info
        required: true
      summary: Create NFS gateway
      x-summary-source: derived
  /nfs-gateways/{gateway_id}:
    get:
      tags:
      - nfs-gateways
      description: show nfs gateway
      operationId: GetNFSGateway
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get NFS gateway
      x-summary-source: derived
    put:
      tags:
      - nfs-gateways
      description: start/stop nfs gateway
      operationId: DoNFSGateway
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force stop or no
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFSGatewayActionReq'
        description: nfs gateway action info
        required: true
      summary: Do NFS gateway
      x-summary-source: derived
    delete:
      tags:
      - nfs-gateways
      description: delete nfs gateway
      operationId: DeleteNFSGateway
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force delete or not
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete NFS gateway
      x-summary-source: derived
    patch:
      tags:
      - nfs-gateways
      description: update nfs gateway
      operationId: UpdateNFSGateway
      parameters:
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFSGatewayUpdateReq'
        description: nfs gateway info
        required: true
      summary: Update NFS gateway
      x-summary-source: derived
  /nfs-gateways/{gateway_id}/buckets:
    get:
      tags:
      - nfs-gateways
      description: List nfs gateway bucket maps
      operationId: ListNFSGatewayBucketMaps
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: gateway_id
        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSGatewayBucketMapsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List NFS gateway bucket maps
      x-summary-source: derived
  /nfs-gateways/{gateway_id}/buckets/{bucket_id}:
