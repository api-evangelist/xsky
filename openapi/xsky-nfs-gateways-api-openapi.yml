        in: path
        description: nfs gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: bucket_id
        in: path
        description: bucket id
        required: true
        x-exportParamName: BucketId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
