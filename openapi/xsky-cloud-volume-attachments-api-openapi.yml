openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Cloud Volume Attachments API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: cloud-volume-attachments
  description: CloudVolumeAttachmentController Cloud Volume Attachment Management
paths:
  /cloud-volume-attachments/:
    get:
      tags:
      - cloud-volume-attachments
      operationId: ListCloudVolumeAttachments
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: cloud_instance_id
        in: query
        description: cloud instance id
        required: false
        x-exportParamName: CloudInstanceId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudVolumeAttachmentsResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List cloud volume attachments
      x-summary-source: derived
components:
  schemas:
    CloudVolumeAttachment:
      type: object
      properties:
        block_volume:
          $ref: '#/components/schemas/Volume_Nestview'
        cloud_instance:
          $ref: '#/components/schemas/CloudInstance_Nestview'
        cloud_volume:
          $ref: '#/components/schemas/CloudVolume_Nestview'
        create:
          type: string
          format: date-time
        device:
          type: string
        id:
          type: integer
          format: int64
        update:
          type: string
          format: date-time
      title: CloudVolumeAttachment
      description: 'CloudVolumeAttachment defines volume attachment relationship with cloud

        instances'
      example:
        block_volume:
          original_name: original_name
          name: name
          id: 9
        cloud_volume:
          name: name
          id: 6
        create: '2000-01-23T04:56:07.000+00:00'
        update: '2000-01-23T04:56:07.000+00:00'
        cloud_instance:
          name: name
          id: 0
        id: 1
        device: device
    Volume_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        original_name:
          type: string
      title: Volume_Nestview
      example:
        original_name: original_name
        name: name
        id: 9
    CloudVolumeAttachmentsResp:
      type: object
      properties:
        cloud_volume_attachments:
          type: array
          description: cloud volume attachments
          items:
            $ref: '#/components/schemas/CloudVolumeAttachment'
      title: CloudVolumeAttachmentsResp
      example:
        cloud_volume_attachments:
        - block_volume:
            original_name: original_name
            name: name
            id: 9
          cloud_volume:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          cloud_instance:
            name: name
            id: 0
          id: 1
          device: device
        - block_volume:
            original_name: original_name
            name: name
            id: 9
          cloud_volume:
            name: name
            id: 6
          create: '2000-01-23T04:56:07.000+00:00'
          update: '2000-01-23T04:56:07.000+00:00'
          cloud_instance:
            name: name
            id: 0
          id: 1
          device: device
    CloudInstance_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: CloudInstance_Nestview
      example:
        name: name
        id: 0
    CloudVolume_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: CloudVolume_Nestview
      example:
        name: name
        id: 6
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
