          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Cluster
      x-summary-source: derived
    patch:
      tags:
      - Cluster
      description: set disk lighting mode of cluster
      operationId: UpdateCluster
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
