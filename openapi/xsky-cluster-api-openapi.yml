openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Cluster API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: Cluster
  description: ClusterController API /cluster
