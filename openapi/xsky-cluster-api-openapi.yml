  /cluster/:
    get:
      tags:
      - Cluster
      description: Output the status of the cluster
      operationId: Cluster
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRecordResp'
