        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateReq'
        description: cluster disk lighting info
        required: true
      summary: Update cluster
      x-summary-source: derived
