swagger: '2.0'
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS access-paths cluster API
  contact: {}
  license:
    name: Commercial
basePath: /v1
tags:
- name: cluster
  description: 'ClusterController API /cluster

    '
paths:
  /cluster/:
    get:
      tags:
      - cluster
      description: Output the status of the cluster
      operationId: Cluster
      consumes:
      - application/json
      produces:
      - application/json
      parameters: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ClusterRecordResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - cluster
      description: set disk lighting mode of cluster
      operationId: UpdateCluster
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: cluster disk lighting info
        required: true
        schema:
          $ref: '#/definitions/ClusterUpdateReq'
        x-exportParamName: Body
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ClusterResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
