      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    delete:
      tags:
      - cluster
      description: Delete object storage system in current cluster
      operationId: DeleteObjectStorage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: force
        in: query
        description: force delete or not
        required: false
        type: boolean
        x-exportParamName: Force
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageResp'
        409:
          description: Conflicted
        500:
          description: Server Error
      security:
      - tokenInQuery: []
      - tokenInHeader: []
    patch:
      tags:
      - cluster
      description: Set object storage system in current cluster
      operationId: SetObjectStorage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: set info
        required: true
        schema:
          $ref: '#/definitions/ObjectStorageSetReq'
        x-exportParamName: Body
      responses:
        202:
          description: Accepted
          schema:
            $ref: '#/definitions/ObjectStorageResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
  /cluster/object-storage:commit-master-switching:
    post:
      tags:
