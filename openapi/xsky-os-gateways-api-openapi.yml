    properties:
      admin_ip:
        type: string
      id:
        type: integer
        format: int64
      name:
        type: string
    title: Host_Nestview
    example:
      name: name
      admin_ip: admin_ip
      id: 0
  ObjectStorageGatewayCreateReq:
    type: object
    properties:
      os_gateway:
        $ref: '#/definitions/ObjectStorageGatewayCreateReq_Gateway'
    title: ObjectStorageGatewayCreateReq
    example:
      os_gateway:
        role: role
        port: 6
        name: name
        description: description
        gateway_ip: gateway_ip
        host_id: 0
  ObjectStorageZone_Nestview:
