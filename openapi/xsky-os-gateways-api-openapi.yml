    description: ObjectStorageGateway is the model of object_storage_gateway @grpc-models-proto
  ObjectStorageGatewayUpdateReq_Gateway:
    type: object
    properties:
      action:
        type: string
    title: ObjectStorageGatewayUpdateReq_Gateway
    example:
