openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Os Storage Classes API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: os-storage-classes
  description: OSStorageClassController API /os-storage-classes.
paths:
  /os-storage-classes/:
    get:
      tags:
      - os-storage-classes
      description: List os storage classes
      operationId: ListOSStorageClasses
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: os_policy_id
        in: query
        description: os policy id
        required: false
        x-exportParamName: OsPolicyId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSStorageClassesResp'
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List OS storage classes
      x-summary-source: derived
  /os-storage-classes/{storage_class_id}:
    get:
      tags:
      - os-storage-classes
      description: Get a os storage class
      operationId: GetOSStorageClass
      parameters:
      - name: storage_class_id
        in: path
        description: storage class id
        required: true
        x-exportParamName: StorageClassId
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSStorageClassResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get OS storage class
      x-summary-source: derived
    patch:
      tags:
      - os-storage-classes
      description: update storage class
      operationId: UpdateOSStorageClass
      parameters:
      - name: storage_class_id
        in: path
        description: storage class id
        required: true
        x-exportParamName: StorageClassId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSStorageClassResp'
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSStorageClassResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSStorageClassUpdateReq'
        description: storage class info
        required: true
      summary: Update OS storage class
      x-summary-source: derived
