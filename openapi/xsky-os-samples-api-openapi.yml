    OSBucketUsageCategory:
      type: object
      properties:
        download_bytes:
          type: integer
          format: int64
        ops:
          type: integer
          format: int64
        upload_bytes:
          type: integer
          format: int64
      title: OSBucketUsageCategory
      description: OSBucketUsageCategory contain usage info
      example:
        ops: 6
        download_bytes: 0
        upload_bytes: 1
    OSSample:
      type: object
      properties:
        delete_obj_category:
          $ref: '#/components/schemas/OSBucketUsageCategory'
        get_obj_category:
          $ref: '#/components/schemas/OSBucketUsageCategory'
        list_bucket_category:
          $ref: '#/components/schemas/OSBucketUsageCategory'
        objects:
          type: integer
          format: int64
        post_obj_category:
          $ref: '#/components/schemas/OSBucketUsageCategory'
        put_obj_category:
          $ref: '#/components/schemas/OSBucketUsageCategory'
        used_capacity_bytes:
          type: object
          additionalProperties:
            type: integer
            format: int64
      title: OSSample
      description: OSSample contains os samples
      example:
        used_capacity_bytes:
          key: 5
        post_obj_category:
          ops: 6
