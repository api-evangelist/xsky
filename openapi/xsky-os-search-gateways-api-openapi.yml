openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Os Search Gateways API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: os-search-gateways
  description: OSSearchGatewayController provides API for os search gateways
paths:
  /os-search-gateways/:
    get:
      tags:
      - os-search-gateways
      description: List OS Search Gateways
      operationId: ListOSSearchGateways
      parameters:
      - name: os_search_engine_id
        in: query
        description: os search engine id
        required: false
        x-exportParamName: OsSearchEngineId
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSSearchGatewaysResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List OS search gateways
      x-summary-source: derived
  /os-search-gateways/{gateway_id}:
    get:
      tags:
      - os-search-gateways
      description: Get OS Search Gateway
      operationId: GetOSSearchGateways
      parameters:
      - name: gateway_id
        in: path
        description: os search gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSSearchGatewayResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get OS search gateways
      x-summary-source: derived
  /os-search-gateways/{gateway_id}/samples:
    get:
      tags:
      - os-search-gateways
      description: get a os search gateway's samples
      operationId: GetOSSearchGatewaySamples
      parameters:
      - name: gateway_id
        in: path
        description: os search gateway id
        required: true
        x-exportParamName: GatewayId
        schema:
          type: integer
          format: int64
      - name: duration_begin
        in: query
        description: duration begin timestamp
        required: false
        x-exportParamName: DurationBegin
        schema:
          type: string
      - name: duration_end
        in: query
        description: duration end timestamp
        required: false
        x-exportParamName: DurationEnd
        schema:
          type: string
      - name: period
        in: query
        description: samples period
        required: false
        x-exportParamName: Period
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSSearchGatewaySamplesResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get OS search gateway samples
      x-summary-source: derived
components:
  schemas:
    OSSearchGatewaySamplesResp:
      type: object
      required:
      - os_search_gateway_samples
      properties:
        os_search_gateway_samples:
          type: array
          items:
            $ref: '#/components/schemas/OSSearchGatewayStat'
      title: OSSearchGatewaySamplesResp
      example:
        os_search_gateway_samples:
        - read_bandwidth_kbyte: 1.4658129805029452
          write_bandwidth_kbyte: 2.3021358869347655
          mem_usage_percent: 6.027456183070403
          create: '2000-01-23T04:56:07.000+00:00'
          write_iops: 7.061401241503109
          write_latency_us: 9.301444243932576
          read_latency_us: 5.637376656633329
          cpu_util: 0.8008281904610115
          read_iops: 5.962133916683182
        - read_bandwidth_kbyte: 1.4658129805029452
          write_bandwidth_kbyte: 2.3021358869347655
          mem_usage_percent: 6.027456183070403
          create: '2000-01-23T04:56:07.000+00:00'
          write_iops: 7.061401241503109
          write_latency_us: 9.301444243932576
          read_latency_us: 5.637376656633329
          cpu_util: 0.8008281904610115
          read_iops: 5.962133916683182
    OSSearchGatewayResp:
      type: object
      required:
      - os_search_gateway
      properties:
        os_search_gateway:
          $ref: '#/components/schemas/OSSearchGatewayRecord'
      title: OSSearchGatewayResp
      example:
        os_search_gateway: ''
    OSSearchGatewaysResp:
      type: object
      required:
      - os_search_gateways
      properties:
        os_search_gateways:
          type: array
          items:
            $ref: '#/components/schemas/OSSearchGatewayRecord'
      title: OSSearchGatewaysResp
      example:
        os_search_gateways:
        - ''
        - ''
    OSSearchEngine_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
      title: OSSearchEngine_Nestview
    Host_Nestview:
      type: object
      required:
      - admin_ip
      properties:
        admin_ip:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
      title: Host_Nestview
      example:
        name: name
        admin_ip: admin_ip
        id: 0
    Pool_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: Pool_Nestview
      example:
        name: name
        id: 5
    OSSearchGatewayStat:
      type: object
      properties:
        cpu_util:
          type: number
          format: double
        create:
          type: string
          format: date-time
        mem_usage_percent:
          type: number
          format: double
        read_bandwidth_kbyte:
          type: number
          format: double
        read_iops:
          type: number
          format: double
        read_latency_us:
          type: number
          format: double
        write_bandwidth_kbyte:
          type: number
          format: double
        write_iops:
          type: number
          format: double
        write_latency_us:
          type: number
          format: double
      title: OSSearchGatewayStat
      description: OSSearchGatewayStat defines model os OS search gateway stat
      example:
        read_bandwidth_kbyte: 1.4658129805029452
        write_bandwidth_kbyte: 2.3021358869347655
        mem_usage_percent: 6.027456183070403
        create: '2000-01-23T04:56:07.000+00:00'
        write_iops: 7.061401241503109
        write_latency_us: 9.301444243932576
        read_latency_us: 5.637376656633329
        cpu_util: 0.8008281904610115
        read_iops: 5.962133916683182
    OSSearchGateway:
      type: object
      properties:
        action_status:
          type: string
        create:
          type: string
          format: date-time
        host:
          $ref: '#/components/schemas/Host_Nestview'
        id:
          type: integer
          format: int64
        pool:
          $ref: '#/components/schemas/Pool_Nestview'
        search_engine:
          $ref: '#/components/schemas/OSSearchEngine_Nestview'
        status:
          type: string
        update:
          type: string
          format: date-time
      title: OSSearchGateway
      description: OSSearchGateway defines model os OS search gateway
    OSSearchGatewayRecord:
      title: OSSearchGatewayRecord
      allOf:
      - $ref: '#/components/schemas/OSSearchGateway'
      - properties:
          samples:
            type: array
            items:
              $ref: '#/components/schemas/OSSearchGatewayStat'
      description: 'OSSearchGatewayRecord combine OSSearchGateway and OSSearchGatewayStat to let API

        comfortable'
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
