openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Licenses API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: Licenses
  description: LicenseController Operations about Install
paths:
  /licenses/:
    get:
      tags:
      - Licenses
      operationId: ListLicenses
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: active
        in: query
        description: filter license by active status
        required: false
        x-exportParamName: Active
        schema:
          type: boolean
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensesResp'
        500:
          description: InternalServerError
      summary: List licenses
      x-summary-source: derived
    post:
      tags:
      - Licenses
      description: Activate product license
      operationId: RegisterLicense
      parameters:
      - name: force
        in: query
        description: force activate
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                license:
                  type: string
                  description: license info
                  format: binary
              required:
              - license
      summary: Register license
      x-summary-source: derived
  /licenses/key:
    get:
      tags:
      - Licenses
      description: get license key file
      operationId: DownloadLicenseKey
      responses:
        200:
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: NotFound
        500:
          description: InternalServerError
      summary: Download license key
      x-summary-source: derived
  /licenses/license:
    get:
      tags:
      - Licenses
      description: get current active license
      operationId: GetActiveLicense
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get active license
      x-summary-source: derived
  /licenses/{license_id}:
    get:
      tags:
      - Licenses
      description: get license
      operationId: GetLicense
      parameters:
      - name: license_id
        in: path
        description: the license id
        required: true
        x-exportParamName: LicenseId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get license
      x-summary-source: derived
