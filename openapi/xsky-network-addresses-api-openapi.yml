          type: integer
          format: int64
      - name: host_id
        in: query
        description: host id
        required: false
        x-exportParamName: HostId
        schema:
          type: integer
          format: int64
      - name: role
        in: query
        description: network address role
        required: false
        x-exportParamName: Role
