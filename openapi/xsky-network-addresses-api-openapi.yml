      - network-addresses
      description: Get a network address
      operationId: GetNetworkAddress
      parameters:
      - name: network_address_id
        in: path
        description: network address id
        required: true
        x-exportParamName: NetworkAddressId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAddressResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get network address
      x-summary-source: derived
