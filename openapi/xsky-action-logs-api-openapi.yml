openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Action Logs API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: action-logs
  description: ActionLogController Operations about ActionLog
paths:
  /action-logs/:
    get:
      tags:
      - action-logs
      operationId: ListActionLogs
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: resource_type
        in: query
        description: resource type of action logs
        required: false
        x-exportParamName: ResourceType
        schema:
          type: string
      - name: status
        in: query
        description: status of action logs
        required: false
        x-exportParamName: Status
        schema:
          type: string
      - name: user_id
        in: query
        description: user id of action logs
        required: false
        x-exportParamName: UserId
        schema:
          type: integer
          format: int64
      - name: create_begin
        in: query
        description: create begin timestamp
        required: false
        x-exportParamName: CreateBegin
        schema:
          type: string
      - name: create_end
        in: query
        description: create end timestamp
        required: false
        x-exportParamName: CreateEnd
        schema:
          type: string
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: related_resource
        in: query
        description: related resource info of search
        required: false
        x-exportParamName: RelatedResource
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionLogsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List action logs
      x-summary-source: derived
components:
  schemas:
    User_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: id of user
        name:
          type: string
          description: name of user
      title: User_Nestview
      example:
        name: name
        id: 6
    ActionLog:
      type: object
      properties:
        action:
          type: string
        client_ip:
          type: string
        create:
          type: string
          format: date-time
        finish:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        message:
          type: string
        new_data:
          type: object
          properties: {}
        old_data:
          type: object
          properties: {}
        parameter:
          type: string
        related_resources:
          type: array
          items:
            type: object
            properties: {}
        resource_id:
          type: integer
          format: int64
        resource_type:
          type: string
        start:
          type: string
          format: date-time
        status:
          type: string
        user:
          $ref: '#/components/schemas/User_Nestview'
      title: ActionLog
      description: ActionLog defines a user action
    Alert_Nestview:
      type: object
      properties:
        alarm_id:
          type: string
        id:
          type: integer
          format: int64
      title: Alert_Nestview
    ActionLog_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
      title: ActionLog_Nestview
    ErrorRecord:
      type: object
      properties:
        action_log:
          $ref: '#/components/schemas/ActionLog_Nestview'
        alert:
          $ref: '#/components/schemas/Alert_Nestview'
        code:
          type: string
        create:
          type: string
          format: date-time
        details:
          type: string
        extra_data:
          type: object
          properties: {}
        host:
          $ref: '#/components/schemas/Host_Nestview'
        id:
          type: integer
          format: int64
        message:
          type: string
      title: ErrorRecord
      description: ErrorRecord defines the error record attributes.
    Host_Nestview:
      type: object
      required:
      - admin_ip
      properties:
        admin_ip:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
      title: Host_Nestview
      example:
        name: name
        admin_ip: admin_ip
        id: 0
    ActionLogRecord:
      title: ActionLogRecord
      allOf:
      - $ref: '#/components/schemas/ActionLog'
      - properties:
          error_records:
            type: array
            items:
              $ref: '#/components/schemas/ErrorRecord'
      description: ActionLogRecord defines the response errors of action log
    ActionLogsResp:
      type: object
      required:
      - action_logs
      properties:
        action_logs:
          type: array
          items:
            $ref: '#/components/schemas/ActionLogRecord'
      title: ActionLogsResp
      example:
        action_logs:
        - ''
        - ''
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
