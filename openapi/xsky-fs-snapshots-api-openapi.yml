openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Fs Snapshots API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: fs-snapshots
  description: FSSnapshotController provides APIs for file storage snapshot
paths:
  /fs-snapshots/:
    get:
      tags:
      - fs-snapshots
      description: List file storage snapshots
      operationId: ListFSSnapshots
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      - name: fs_folder_id
        in: query
        description: file storage folder id
        required: false
        x-exportParamName: FsFolderId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSnapshotsResp'
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List FS snapshots
      x-summary-source: derived
    post:
      tags:
      - fs-snapshots
      description: Create file storage snapshot
      operationId: CreateFSSnapshot
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSnapshotResp'
        400:
          description: BadRequest
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSSnapshotCreateReq'
        description: snapshot info
        required: true
      summary: Create FS snapshot
      x-summary-source: derived
  /fs-snapshots/{fs_snapshot_id}:
    get:
      tags:
      - fs-snapshots
      description: Get file storage snapshot
      operationId: GetFSSnapshot
      parameters:
      - name: fs_snapshot_id
        in: path
        description: file storage snapshot id
        required: true
        x-exportParamName: FsSnapshotId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSnapshotResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get FS snapshot
      x-summary-source: derived
    delete:
      tags:
      - fs-snapshots
      description: delete file storage snapshot
      operationId: DeleteFSSnapshot
      parameters:
      - name: fs_snapshot_id
        in: path
        description: snapshot id
        required: true
        x-exportParamName: FsSnapshotId
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: force delete or not
        required: false
        x-exportParamName: Force
        schema:
          type: boolean
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSnapshotResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete FS snapshot
      x-summary-source: derived
    patch:
      tags:
      - fs-snapshots
      description: Update file storage snapshot
      operationId: UpdateFSSnapshot
      parameters:
      - name: fs_snapshot_id
        in: path
        description: snapshot id
        required: true
        x-exportParamName: FsSnapshotId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSSnapshotResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        409:
          description: Conflict
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSSnapshotUpdateReq'
        description: snapshot info
        required: true
      summary: Update FS snapshot
      x-summary-source: derived
components:
  schemas:
    FSSnapshotUpdateReq_Snapshot:
      type: object
      properties:
        description:
          type: string
          description: description of file storage snapshot
        name:
          type: string
          description: name of snapshot
      title: FSSnapshotUpdateReq_Snapshot
    Snapshot_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: Snapshot_Nestview
      example:
        name: name
        id: 0
    FSSnapshotCreateReq:
      type: object
      required:
      - fs_snapshot
      properties:
        fs_snapshot:
          $ref: '#/components/schemas/FSSnapshotCreateReq_Snapshot'
      title: FSSnapshotCreateReq
    FSSnapshot:
      type: object
      properties:
        allocated_size:
          type: integer
          format: int64
        block_snapshot:
          $ref: '#/components/schemas/Snapshot_Nestview'
        clone_folder_num:
          type: integer
          format: int64
        create:
          type: string
          format: date-time
        creator:
          type: string
        description:
          type: string
        formatted:
          type: boolean
        fs_folder:
          $ref: '#/components/schemas/FSFolder_Nestview'
        id:
          type: integer
          format: int64
        name:
          type: string
        pool:
          $ref: '#/components/schemas/Pool_Nestview'
        size:
          type: integer
          format: int64
        status:
          type: string
        update:
          type: string
          format: date-time
      title: FSSnapshot
      description: FSSnapshot defines model of file storage snapshot
      example:
        creator: creator
        formatted: true
        pool:
          name: name
          id: 5
        description: description
        update: '2000-01-23T04:56:07.000+00:00'
        allocated_size: 0
        block_snapshot:
          name: name
          id: 0
        size: 5
        clone_folder_num: 6
        fs_folder:
          name: name
          id: 6
        name: name
        create: '2000-01-23T04:56:07.000+00:00'
        id: 1
        status: status
    FSSnapshotResp:
      type: object
      required:
      - fs_snapshot
      properties:
        fs_snapshot:
          description: file storage snapshot
          $ref: '#/components/schemas/FSSnapshot'
      title: FSSnapshotResp
      example:
        fs_snapshot:
          creator: creator
          formatted: true
          pool:
            name: name
            id: 5
          description: description
          update: '2000-01-23T04:56:07.000+00:00'
          allocated_size: 0
          block_snapshot:
            name: name
            id: 0
          size: 5
          clone_folder_num: 6
          fs_folder:
            name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          id: 1
          status: status
    FSSnapshotUpdateReq:
      type: object
      required:
      - fs_snapshot
      properties:
        fs_snapshot:
          $ref: '#/components/schemas/FSSnapshotUpdateReq_Snapshot'
      title: FSSnapshotUpdateReq
    FSFolder_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: FSFolder_Nestview
      example:
        name: name
        id: 6
    FSSnapshotsResp:
      type: object
      required:
      - fs_snapshots
      properties:
        fs_snapshots:
          type: array
          description: file storage snapshots
          items:
            $ref: '#/components/schemas/FSSnapshot'
      title: FSSnapshotsResp
      example:
        fs_snapshots:
        - creator: creator
          formatted: true
          pool:
            name: name
            id: 5
          description: description
          update: '2000-01-23T04:56:07.000+00:00'
          allocated_size: 0
          block_snapshot:
            name: name
            id: 0
          size: 5
          clone_folder_num: 6
          fs_folder:
            name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          id: 1
          status: status
        - creator: creator
          formatted: true
          pool:
            name: name
            id: 5
          description: description
          update: '2000-01-23T04:56:07.000+00:00'
          allocated_size: 0
          block_snapshot:
            name: name
            id: 0
          size: 5
          clone_folder_num: 6
          fs_folder:
            name: name
            id: 6
          name: name
          create: '2000-01-23T04:56:07.000+00:00'
          id: 1
          status: status
    FSSnapshotCreateReq_Snapshot:
      type: object
      required:
      - fs_folder_id
      - name
      properties:
        description:
          type: string
          description: description of file storage snapshot
        fs_folder_id:
          type: integer
          format: int64
          description: file storage folder id
        name:
          type: string
          description: name of snapshot
      title: FSSnapshotCreateReq_Snapshot
    Pool_Nestview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      title: Pool_Nestview
      example:
        name: name
        id: 5
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
