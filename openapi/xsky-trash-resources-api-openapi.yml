openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Trash Resources API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: trash-resources
  description: TrashResourceController Operations about Trash
paths:
  /trash-resources/:
    get:
      tags:
      - trash-resources
      operationId: ListTrashResources
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        description: the type of trash resources
        required: false
        x-exportParamName: Type_
        schema:
          type: string
      - name: q
        in: query
        description: query param of search
        required: false
        x-exportParamName: Q
        schema:
          type: string
      - name: sort
        in: query
        description: sort param of search
        required: false
        x-exportParamName: Sort
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResourcesResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: List trash resources
      x-summary-source: derived
  /trash-resources/{trash_resource_id}:
    get:
      tags:
      - trash-resources
      description: get a trash resource
      operationId: GetTrashResource
      parameters:
      - name: trash_resource_id
        in: path
        description: trash resource id
        required: true
        x-exportParamName: TrashResourceId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResourceResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get trash resource
      x-summary-source: derived
    delete:
      tags:
      - trash-resources
      operationId: DeleteTrashResource
      parameters:
      - name: trash_resource_id
        in: path
        description: trash resource id
        required: true
        x-exportParamName: TrashResourceId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResourceResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Delete trash resource
      x-summary-source: derived
  /trash-resources/{trash_resource_id}:restore:
    post:
      tags:
      - trash-resources
      operationId: RestoreTrashResource
      parameters:
      - name: trash_resource_id
        in: path
        description: trash resource id
        required: true
        x-exportParamName: TrashResourceId
        schema:
          type: integer
          format: int64
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResourceResp'
        400:
          description: BadRequest
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Restore trash resource
      x-summary-source: derived
components:
  schemas:
    TrashResourceResp:
      type: object
      required:
      - trash_resource
      properties:
        trash_resource:
          description: trash resource
          $ref: '#/components/schemas/TrashResource'
      title: TrashResourceResp
      example:
        trash_resource:
          resource_type: resource_type
          create: '2000-01-23T04:56:07.000+00:00'
          expire_time: '2000-01-23T04:56:07.000+00:00'
          resource_id: 6
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
          status: status
    TrashResourcesResp:
      type: object
      required:
      - trash_resources
      properties:
        trash_resources:
          type: array
          description: trash resources
          items:
            $ref: '#/components/schemas/TrashResource'
      title: TrashResourcesResp
      example:
        trash_resources:
        - resource_type: resource_type
          create: '2000-01-23T04:56:07.000+00:00'
          expire_time: '2000-01-23T04:56:07.000+00:00'
          resource_id: 6
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
          status: status
        - resource_type: resource_type
          create: '2000-01-23T04:56:07.000+00:00'
          expire_time: '2000-01-23T04:56:07.000+00:00'
          resource_id: 6
          update: '2000-01-23T04:56:07.000+00:00'
          id: 0
          action_status: action_status
          status: status
    TrashResource:
      type: object
      properties:
        action_status:
          type: string
        create:
          type: string
          format: date-time
        expire_time:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        resource_id:
          type: integer
          format: int64
        resource_type:
          type: string
        status:
          type: string
        update:
          type: string
          format: date-time
      title: TrashResource
      description: TrashResource is the corresponding trash record.
      example:
        resource_type: resource_type
        create: '2000-01-23T04:56:07.000+00:00'
        expire_time: '2000-01-23T04:56:07.000+00:00'
        resource_id: 6
        update: '2000-01-23T04:56:07.000+00:00'
        id: 0
        action_status: action_status
        status: status
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
