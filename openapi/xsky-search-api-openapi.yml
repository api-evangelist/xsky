openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Search API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: Search
  description: SearchController defines search apis
paths:
  /search/{type}:
    get:
      tags:
      - Search
      description: search objects
      operationId: Search
      parameters:
      - name: type
        in: path
        description: object type
        required: true
        x-exportParamName: Type_
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Search
      x-summary-source: derived
components:
  schemas:
    SourceRecord:
      type: object
      properties:
        type:
          type: string
      title: SourceRecord
      example:
        type: type
    SourcesResp:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceRecord'
      title: SourcesResp
      example:
        sources:
        - type: type
        - type: type
  securitySchemes:
    tokenInHeader:
      description: auth by token
      type: apiKey
      name: Xms-Auth-Token
      in: header
    tokenInQuery:
      description: auth by token
      type: apiKey
      name: token
      in: query
