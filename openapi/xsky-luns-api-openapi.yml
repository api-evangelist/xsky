openapi: 3.2.0
info:
  description: XMS is the controller of distributed storage system
  version: SDS_4.2.000.0.200302
  title: XMS Luns API
  contact: {}
  license:
    name: Commercial
servers:
- url: /v1
tags:
- name: luns
  description: LunController Operations on luns
paths:
  /luns/:
    get:
      tags:
      - luns
      operationId: ListLuns
      parameters:
      - name: limit
        in: query
        description: paging param
        required: false
        x-exportParamName: Limit
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: paging param
        required: false
        x-exportParamName: Offset
        schema:
          type: integer
          format: int64
      - name: mapping_group_id
        in: query
        description: mapping group id
        required: false
        x-exportParamName: MappingGroupId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunsResp'
        400:
          description: BadRequest
        500:
          description: InternalServerError
      security:
      - tokenInHeader: []
      - tokenInQuery: []
      summary: List luns
      x-summary-source: derived
  /luns/{lun_id}:
    get:
      tags:
      - luns
      description: get a lun
      operationId: GetLun
      parameters:
      - name: lun_id
        in: path
        description: lun id
        required: true
        x-exportParamName: LunId
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunResp'
        404:
          description: NotFound
        500:
          description: InternalServerError
      security:
      - tokenInQuery: []
      - tokenInHeader: []
      summary: Get lun
      x-summary-source: derived
