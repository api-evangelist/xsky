  ClientLunMappingRecord:
    title: ClientLunMappingRecord
    allOf:
    - $ref: '#/definitions/ClientLunMapping'
    - properties:
        samples:
          type: array
          items:
            $ref: '#/definitions/VolumeStat'
        session_status:
          type: string
  Volume_Nestview:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      original_name:
        type: string
    title: Volume_Nestview
    example:
      original_name: original_name
      name: name
      id: 9
securityDefinitions:
  tokenInHeader:
    description: auth by token
    type: apiKey
    name: Xms-Auth-Token
    in: header
  tokenInQuery:
    description: auth by token
    type: apiKey
    name: token
    in: query
